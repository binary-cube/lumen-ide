# The language servers bundled with the app (plan 43): Node and the servers, each pinned,
# downloaded only from their official sources and checked, at build time — never at run
# time — by `cargo xtask lsp-bundle` (into `target/lsp/` while developing; `scripts/build.sh`
# puts them beside the app: `<App>.app/Contents/Resources/lsp`, `lsp\` beside the `.exe`).
#
# Layout made:  lsp/manifest.toml · lsp/node/<version>/ · lsp/servers/<server>/<version>/
#
# Node: the official build of an LTS release (nodejs.org/dist), its SHA-256 from that
