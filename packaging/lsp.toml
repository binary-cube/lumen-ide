name = "vtsls"
version = "0.3.0"
license = "MIT (vtsls), Apache-2.0 (TypeScript)"
packages = "packaging/lsp/vtsls"

# HTML, CSS / SCSS and JSON: `vscode-langservers-extracted` (one package, three servers).
# The HTML server loads TypeScript for `<script>` (off here: code embedded in HTML stays the
# built-in engine's), so only what that load reads is kept of it (`prune`: paths relative to
# the server's folder, `*` any name).
[[servers]]
name = "vscode-langservers-extracted"
version = "4.10.0"
license = "MIT (the servers), Apache-2.0 (TypeScript, SchemaStore's schemas), BSD-2-Clause, ISC"
packages = "packaging/lsp/vscode-langservers-extracted"
prune = [
    "node_modules/typescript/bin",
    "node_modules/typescript/lib/*/diagnosticMessages.generated.json",
    "node_modules/typescript/lib/tsc.js",
    "node_modules/typescript/lib/tsserver.js",
    "node_modules/typescript/lib/tsserverlibrary.js",
    "node_modules/typescript/lib/tsserverlibrary.d.ts",
    "node_modules/typescript/lib/typescriptServices.js",
    "node_modules/typescript/lib/typescriptServices.d.ts",
    "node_modules/typescript/lib/typingsInstaller.js",
    "node_modules/typescript/lib/watchGuard.js",
    "node_modules/vscode-langservers-extracted/lib/*/test",
]

