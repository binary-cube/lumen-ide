# The native servers: each one's official release for the platform, from its GitHub
# releases, its SHA-256 pinned (GitHub's own digest of the file). `strip`: the archive's top
# folder; `prune` as above; `universal`: macOS programs built for both architectures, of
# which only the platform's is kept (the dist's universal build joins the two again);
# `strip-debug`: per platform, programs whose debug information is left out (with the
# platform's `strip`, if one is at hand: else kept, and said).

# C / C++. Kept: the program and clang's builtin headers (`stddef.h`, the intrinsics…),
# which it needs to read any code; left out: clang's runtime libraries (compiler-rt, for
# linking sanitizers and profiles: 190 MB on macOS), never read by clangd.
[[servers]]
name = "clangd"
version = "23.1.0"
license = "Apache-2.0 WITH LLVM-exception"
strip = "clangd_23.1.0"
prune = ["lib/clang/*/lib", "lib/clang/*/share"]
universal = ["bin/clangd"]
# Linux's release keeps its debug information (142 → 72 MB without it).
strip-debug = { linux-x64 = ["bin/clangd"] }

