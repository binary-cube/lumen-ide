# Sakura: one of the built-in themes (generated from its palette).

id = "sakura"
name = "Sakura"
appearance = "light"

[palette]
base      = "#fbeef1"
card      = "#fff8f9"
panel     = "#fdf3f5"
line      = "#ebe3e5"
fg        = "#3b2a30"
muted     = "#7e696d"
code      = "#3b2a30"
accent    = "#d6457a"
red       = "#c62f4f"
orange    = "#c4621c"
green     = "#4f8a3a"
cyan      = "#1f8a8a"
blue      = "#3a6ad1"
purple    = "#a63ea8"
yellow    = "#a87a00"
grey      = "#b39aa1"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#ecdee2"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#8f6800"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#b9a8ac"
"editor.gutter.foreground.active"    = "#624e54"
"editor.line.current"                = "#f9f2f3"
"editor.selection"                   = "#d6457a"
"editor.selection.inactive"          = "#efe8e9"
"editor.cursor"                      = "#3b2a30"
"editor.match"                       = "#a87a0038"
"editor.match.current"               = "#a87a008c"

"tab.hover"                          = "#f1eaeb"
"input.background"                   = "$card"
"input.border"                       = "#e4dbdd"
"popup.background"                   = "#fff8f9"
"popup.border"                       = "#ebe3e5"
"shadow"                             = "#0c090514"
"toggle.active"                      = "#d6457a26"

"tree.selection"                     = "#f1eaeb"
"tree.hover"                         = "#f6eff0"
"tree.indentGuide"                   = "#efe8e9"

"sidebar.background"                 = "#fef4f6"
"toolStrip.foreground"               = "#6e595f"
"toolStrip.hover"                    = "#efe8e9"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#fff8f9"

"searchField.background"             = "#fff8f9"
"searchField.border"                 = "#e7dfe1"
"searchField.border.focused"         = "#d6457a"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#3b2a30"
"terminal.ansi.black"                = "#1f2328"
"terminal.ansi.red"                  = "#c62f4f"
"terminal.ansi.green"                = "#4f8a3a"
"terminal.ansi.yellow"               = "#a87a00"
"terminal.ansi.blue"                 = "#3a6ad1"
"terminal.ansi.magenta"              = "#a63ea8"
"terminal.ansi.cyan"                 = "#1f8a8a"
"terminal.ansi.white"                = "#625358"
"terminal.ansi.brightBlack"          = "#a18b91"
"terminal.ansi.brightRed"            = "#bc5067"
"terminal.ansi.brightGreen"          = "#679157"
"terminal.ansi.brightYellow"         = "#a6862e"
"terminal.ansi.brightBlue"           = "#577ac4"
"terminal.ansi.brightMagenta"        = "#a65ba6"
"terminal.ansi.brightCyan"           = "#449191"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#f3eced"
"scrollbar.thumb"                    = "#dcd3d5"
"scrollbar.thumb.active"             = "#c4babd"

"tabBar.background"                  = "#fdf2f4"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#f3eced"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#f1eaeb"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#d8cfd1"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#d6457a"

"icon.folder"                        = "#8a7378"
"icon.php"                           = "#3a6ad1"
"icon.html"                          = "#c4621c"
"icon.javascript"                    = "#a87a00"
"icon.css"                           = "#3a6ad1"
"icon.scss"                          = "#a63ea8"
"icon.json"                          = "#a87a00"
"icon.yaml"                          = "#c62f4f"
"icon.env"                           = "#a87a00"
"icon.git"                           = "#c4621c"
"icon.composer"                      = "#c4621c"
"icon.npm"                           = "#c62f4f"
"icon.lock"                          = "#8a7378"
"icon.docker"                        = "#1f8a8a"
"icon.config"                        = "#8a7378"
"icon.xml"                           = "#c4621c"
"icon.markdown"                      = "#3a6ad1"
"icon.text"                          = "#8a7378"
"icon.twig"                          = "#4f8a3a"
"icon.vue"                           = "#4f8a3a"
"icon.react"                         = "#1f8a8a"
"icon.typescript"                    = "#3a6ad1"
"icon.c"                             = "#3a6ad1"
"icon.cpp"                           = "#a63ea8"
"icon.lua"                           = "#3a6ad1"
"icon.zig"                           = "#c4621c"
"icon.bash"                          = "#4f8a3a"
"icon.toml"                          = "#8a7378"
"icon.dockerfile"                    = "#1f8a8a"
"icon.database"                      = "#a63ea8"
"icon.shell"                         = "#4f8a3a"
"icon.archive"                       = "#c4621c"
"icon.image"                         = "#a63ea8"
"icon.svg"                           = "#c4621c"
"icon.file"                          = "#8a7378"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$blue"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$code"
"tag"                = "$red"
"attribute"          = "$orange"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
