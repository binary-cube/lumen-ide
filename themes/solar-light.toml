# Solar Light: one of the built-in themes (generated from its palette).

id = "solar-light"
name = "Solar Light"
appearance = "light"

[palette]
base      = "#eee8d5"
card      = "#fdf6e3"
panel     = "#f6efdc"
line      = "#ece8d8"
fg        = "#586e75"
muted     = "#617072"
code      = "#586e75"
accent    = "#268bd2"
red       = "#dc322f"
orange    = "#cb4b16"
green     = "#859900"
cyan      = "#2aa198"
blue      = "#268bd2"
purple    = "#6c71c4"
yellow    = "#b58900"
grey      = "#93a1a1"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#e2decd"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#9a7400"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#b4bbb5"
"editor.gutter.foreground.active"    = "#6e8186"
"editor.line.current"                = "#f8f2e0"
"editor.selection"                   = "#268bd2"
"editor.selection.inactive"          = "#f0ebda"
"editor.cursor"                      = "#586e75"
"editor.match"                       = "#b5890038"
"editor.match.current"               = "#b589008c"

"tab.hover"                          = "#f1ecdb"
"input.background"                   = "$card"
"input.border"                       = "#e6e3d4"
"popup.background"                   = "#fdf6e3"
"popup.border"                       = "#ece8d8"
"shadow"                             = "#0c090514"
"toggle.active"                      = "#268bd226"

"tree.selection"                     = "#f1ecdb"
"tree.hover"                         = "#f6f0de"
"tree.indentGuide"                   = "#f0ebda"

"sidebar.background"                 = "#f8f1de"
"toolStrip.foreground"               = "#74878a"
"toolStrip.hover"                    = "#f0ebda"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#fdf6e3"

"searchField.background"             = "#fdf6e3"
"searchField.border"                 = "#e9e6d6"
"searchField.border.focused"         = "#268bd2"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#586e75"
"terminal.ansi.black"                = "#1f2328"
"terminal.ansi.red"                  = "#dc322f"
"terminal.ansi.green"                = "#859900"
"terminal.ansi.yellow"               = "#b58900"
"terminal.ansi.blue"                 = "#268bd2"
"terminal.ansi.magenta"              = "#6c71c4"
"terminal.ansi.cyan"                 = "#2aa198"
"terminal.ansi.white"                = "#79898b"
"terminal.ansi.brightBlack"          = "#849191"
"terminal.ansi.brightRed"            = "#cc5250"
"terminal.ansi.brightGreen"          = "#8d9c2e"
"terminal.ansi.brightYellow"         = "#b0912e"
"terminal.ansi.brightBlue"           = "#4992c5"
"terminal.ansi.brightMagenta"        = "#7b7fbb"
"terminal.ansi.brightCyan"           = "#4ca29c"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#f3eedc"
"scrollbar.thumb"                    = "#dfdecf"
"scrollbar.thumb.active"             = "#cccdc2"

"tabBar.background"                  = "#f4eedb"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#f3eedc"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#f1ecdb"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#dcdbcd"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#268bd2"

"icon.folder"                        = "#839496"
"icon.php"                           = "#268bd2"
"icon.html"                          = "#cb4b16"
"icon.javascript"                    = "#b58900"
"icon.css"                           = "#268bd2"
"icon.scss"                          = "#6c71c4"
"icon.json"                          = "#b58900"
"icon.yaml"                          = "#dc322f"
"icon.env"                           = "#b58900"
"icon.git"                           = "#cb4b16"
"icon.composer"                      = "#cb4b16"
"icon.npm"                           = "#dc322f"
"icon.lock"                          = "#839496"
"icon.docker"                        = "#2aa198"
"icon.config"                        = "#839496"
"icon.xml"                           = "#cb4b16"
"icon.markdown"                      = "#268bd2"
"icon.text"                          = "#839496"
"icon.twig"                          = "#859900"
"icon.vue"                           = "#859900"
"icon.react"                         = "#2aa198"
"icon.typescript"                    = "#268bd2"
"icon.c"                             = "#268bd2"
"icon.cpp"                           = "#6c71c4"
"icon.lua"                           = "#268bd2"
"icon.zig"                           = "#cb4b16"
"icon.bash"                          = "#859900"
"icon.toml"                          = "#839496"
"icon.dockerfile"                    = "#2aa198"
"icon.database"                      = "#6c71c4"
"icon.shell"                         = "#859900"
"icon.archive"                       = "#cb4b16"
"icon.image"                         = "#6c71c4"
"icon.svg"                           = "#cb4b16"
"icon.file"                          = "#839496"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$blue"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$purple"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$code"
"tag"                = "$red"
"attribute"          = "$orange"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
