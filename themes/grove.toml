# Grove: one of the built-in themes (generated from its palette).

id = "grove"
name = "Grove"
appearance = "dark"

[palette]
base      = "#191f1c"
card      = "#1f2622"
panel     = "#272e2a"
line      = "#383f3b"
fg        = "#e3eadf"
muted     = "#8a9a8e"
code      = "#d3ddd0"
accent    = "#7fc47f"
red       = "#e06c6c"
orange    = "#e0a060"
green     = "#a3d17a"
cyan      = "#6cc3b0"
blue      = "#7fb0d6"
purple    = "#c49ad6"
yellow    = "#e3c86b"
grey      = "#68786d"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#292f2c"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#e3c86b"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#5f6c63"
"editor.gutter.foreground.active"    = "#b6c2b6"
"editor.line.current"                = "#282f2b"
"editor.selection"                   = "#7fc47f"
"editor.selection.inactive"          = "#373e39"
"editor.cursor"                      = "#e3eadf"
"editor.match"                       = "#e3c86b38"
"editor.match.current"               = "#e3c86b8c"

"tab.hover"                          = "#2d342f"
"input.background"                   = "$card"
"input.border"                       = "#4a514c"
"popup.background"                   = "#272e2a"
"popup.border"                       = "#424944"
"shadow"                             = "#00000066"
"toggle.active"                      = "#7fc47f59"

"tree.selection"                     = "#333a35"
"tree.hover"                         = "#2b322d"
"tree.indentGuide"                   = "#2f3631"

"sidebar.background"                 = "#1c221f"
"toolStrip.foreground"               = "#a9b6aa"
"toolStrip.hover"                    = "#2f3631"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#1f2622"

"searchField.background"             = "#1b221e"
"searchField.border"                 = "#3c433e"
"searchField.border.focused"         = "#7fc47f"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#e3eadf"
"terminal.ansi.black"                = "#141916"
"terminal.ansi.red"                  = "#e06c6c"
"terminal.ansi.green"                = "#a3d17a"
"terminal.ansi.yellow"               = "#e3c86b"
"terminal.ansi.blue"                 = "#7fb0d6"
"terminal.ansi.magenta"              = "#c49ad6"
"terminal.ansi.cyan"                 = "#6cc3b0"
"terminal.ansi.white"                = "#bcc3b9"
"terminal.ansi.brightBlack"          = "#68786d"
"terminal.ansi.brightRed"            = "#e68989"
"terminal.ansi.brightGreen"          = "#b5da95"
"terminal.ansi.brightYellow"         = "#e9d389"
"terminal.ansi.brightBlue"           = "#99c0de"
"terminal.ansi.brightMagenta"        = "#d0aede"
"terminal.ansi.brightCyan"           = "#89cfc0"
"terminal.ansi.brightWhite"          = "#e3eadf"

"scrollbar.track"                    = "#2b322d"
"scrollbar.thumb"                    = "#464d48"
"scrollbar.thumb.active"             = "#5e655e"

"tabBar.background"                  = "#1b221e"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#2b322d"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#2d342f"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#464d48"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#7fc47f"

"icon.folder"                        = "#8a9a8e"
"icon.php"                           = "#7fb0d6"
"icon.html"                          = "#e0a060"
"icon.javascript"                    = "#e3c86b"
"icon.css"                           = "#7fb0d6"
"icon.scss"                          = "#c49ad6"
"icon.json"                          = "#e3c86b"
"icon.yaml"                          = "#e06c6c"
"icon.env"                           = "#e3c86b"
"icon.git"                           = "#e0a060"
"icon.composer"                      = "#e0a060"
"icon.npm"                           = "#e06c6c"
"icon.lock"                          = "#8a9a8e"
"icon.docker"                        = "#6cc3b0"
"icon.config"                        = "#8a9a8e"
"icon.xml"                           = "#e0a060"
"icon.markdown"                      = "#7fb0d6"
"icon.text"                          = "#8a9a8e"
"icon.twig"                          = "#a3d17a"
"icon.vue"                           = "#a3d17a"
"icon.react"                         = "#6cc3b0"
"icon.typescript"                    = "#7fb0d6"
"icon.c"                             = "#7fb0d6"
"icon.cpp"                           = "#c49ad6"
"icon.lua"                           = "#7fb0d6"
"icon.zig"                           = "#e0a060"
"icon.bash"                          = "#a3d17a"
"icon.toml"                          = "#8a9a8e"
"icon.dockerfile"                    = "#6cc3b0"
"icon.database"                      = "#c49ad6"
"icon.shell"                         = "#a3d17a"
"icon.archive"                       = "#e0a060"
"icon.image"                         = "#c49ad6"
"icon.svg"                           = "#e0a060"
"icon.file"                          = "#8a9a8e"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$purple"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$yellow"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
