# Retro: one of the built-in themes (generated from its palette).

id = "retro"
name = "Retro"
appearance = "dark"

[palette]
base      = "#1d2021"
card      = "#282828"
panel     = "#302f2e"
line      = "#413f3a"
fg        = "#ebdbb2"
muted     = "#a89984"
code      = "#ebdbb2"
accent    = "#fabd2f"
red       = "#fb4934"
orange    = "#fe8019"
green     = "#b8bb26"
cyan      = "#8ec07c"
blue      = "#83a598"
purple    = "#d3869b"
yellow    = "#fabd2f"
grey      = "#7c6f64"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#2d2f2d"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#fabd2f"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#756c5f"
"editor.gutter.foreground.active"    = "#caba9b"
"editor.line.current"                = "#31302e"
"editor.selection"                   = "#fabd2f"
"editor.selection.inactive"          = "#3f3d39"
"editor.cursor"                      = "#ebdbb2"
"editor.match"                       = "#fabd2f38"
"editor.match.current"               = "#fabd2f8c"

"tab.hover"                          = "#363532"
"input.background"                   = "$card"
"input.border"                       = "#534f46"
"popup.background"                   = "#302f2e"
"popup.border"                       = "#4b4841"
"shadow"                             = "#00000066"
"toggle.active"                      = "#fabd2f59"

"tree.selection"                     = "#3c3a36"
"tree.hover"                         = "#343330"
"tree.indentGuide"                   = "#383633"

"sidebar.background"                 = "#222424"
"toolStrip.foreground"               = "#bfb094"
"toolStrip.hover"                    = "#383633"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#282828"

"searchField.background"             = "#212324"
"searchField.border"                 = "#45433d"
"searchField.border.focused"         = "#fabd2f"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#ebdbb2"
"terminal.ansi.black"                = "#171a1a"
"terminal.ansi.red"                  = "#fb4934"
"terminal.ansi.green"                = "#b8bb26"
"terminal.ansi.yellow"               = "#fabd2f"
"terminal.ansi.blue"                 = "#83a598"
"terminal.ansi.magenta"              = "#d3869b"
"terminal.ansi.cyan"                 = "#8ec07c"
"terminal.ansi.white"                = "#c4b796"
"terminal.ansi.brightBlack"          = "#7c6f64"
"terminal.ansi.brightRed"            = "#fc6d5d"
"terminal.ansi.brightGreen"          = "#c6c951"
"terminal.ansi.brightYellow"         = "#fbca59"
"terminal.ansi.brightBlue"           = "#9cb7ad"
"terminal.ansi.brightMagenta"        = "#dc9eaf"
"terminal.ansi.brightCyan"           = "#a5cd96"
"terminal.ansi.brightWhite"          = "#ebdbb2"

"scrollbar.track"                    = "#343330"
"scrollbar.thumb"                    = "#4f4c44"
"scrollbar.thumb.active"             = "#666154"

"tabBar.background"                  = "#212324"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#343330"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#363532"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#4f4c44"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#fabd2f"

"icon.folder"                        = "#a89984"
"icon.php"                           = "#83a598"
"icon.html"                          = "#fe8019"
"icon.javascript"                    = "#fabd2f"
"icon.css"                           = "#83a598"
"icon.scss"                          = "#d3869b"
"icon.json"                          = "#fabd2f"
"icon.yaml"                          = "#fb4934"
"icon.env"                           = "#fabd2f"
"icon.git"                           = "#fe8019"
"icon.composer"                      = "#fe8019"
"icon.npm"                           = "#fb4934"
"icon.lock"                          = "#a89984"
"icon.docker"                        = "#8ec07c"
"icon.config"                        = "#a89984"
"icon.xml"                           = "#fe8019"
"icon.markdown"                      = "#83a598"
"icon.text"                          = "#a89984"
"icon.twig"                          = "#b8bb26"
"icon.vue"                           = "#b8bb26"
"icon.react"                         = "#8ec07c"
"icon.typescript"                    = "#83a598"
"icon.c"                             = "#83a598"
"icon.cpp"                           = "#d3869b"
"icon.lua"                           = "#83a598"
"icon.zig"                           = "#fe8019"
"icon.bash"                          = "#b8bb26"
"icon.toml"                          = "#a89984"
"icon.dockerfile"                    = "#8ec07c"
"icon.database"                      = "#d3869b"
"icon.shell"                         = "#b8bb26"
"icon.archive"                       = "#fe8019"
"icon.image"                         = "#d3869b"
"icon.svg"                           = "#fe8019"
"icon.file"                          = "#a89984"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$yellow"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
