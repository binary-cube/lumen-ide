# Solar Dark: one of the built-in themes (generated from its palette).

id = "solar-dark"
name = "Solar Dark"
appearance = "dark"

[palette]
base      = "#00222b"
card      = "#002b36"
panel     = "#0a333c"
line      = "#1f444b"
fg        = "#eee8d5"
muted     = "#87989a"
code      = "#93a1a1"
accent    = "#268bd2"
red       = "#dc322f"
orange    = "#cb4b16"
green     = "#859900"
cyan      = "#2aa198"
blue      = "#268bd2"
purple    = "#6c71c4"
yellow    = "#b58900"
grey      = "#586e75"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#133239"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#b58900"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#4f6a70"
"editor.gutter.foreground.active"    = "#b8beb6"
"editor.line.current"                = "#0b343d"
"editor.selection"                   = "#268bd2"
"editor.selection.inactive"          = "#1d4249"
"editor.cursor"                      = "#eee8d5"
"editor.match"                       = "#b5890038"
"editor.match.current"               = "#b589008c"

"tab.hover"                          = "#113841"
"input.background"                   = "$card"
"input.border"                       = "#345559"
"popup.background"                   = "#0a333c"
"popup.border"                       = "#2b4d53"
"shadow"                             = "#00000066"
"toggle.active"                      = "#268bd259"

"tree.selection"                     = "#183e46"
"tree.hover"                         = "#0e3640"
"tree.indentGuide"                   = "#133a43"

"sidebar.background"                 = "#002630"
"toolStrip.foreground"               = "#a8b1ac"
"toolStrip.hover"                    = "#133a43"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#ffffff"

"searchField.background"             = "#00262f"
"searchField.border"                 = "#24474e"
"searchField.border.focused"         = "#268bd2"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#eee8d5"
"terminal.ansi.black"                = "#001b22"
"terminal.ansi.red"                  = "#dc322f"
"terminal.ansi.green"                = "#859900"
"terminal.ansi.yellow"               = "#b58900"
"terminal.ansi.blue"                 = "#268bd2"
"terminal.ansi.magenta"              = "#6c71c4"
"terminal.ansi.cyan"                 = "#2aa198"
"terminal.ansi.white"                = "#bec2b5"
"terminal.ansi.brightBlack"          = "#586e75"
"terminal.ansi.brightRed"            = "#e35b59"
"terminal.ansi.brightGreen"          = "#9dad33"
"terminal.ansi.brightYellow"         = "#c4a133"
"terminal.ansi.brightBlue"           = "#51a2db"
"terminal.ansi.brightMagenta"        = "#898dd0"
"terminal.ansi.brightCyan"           = "#55b4ad"
"terminal.ansi.brightWhite"          = "#eee8d5"

"scrollbar.track"                    = "#0e3640"
"scrollbar.thumb"                    = "#305156"
"scrollbar.thumb.active"             = "#4c6769"

"tabBar.background"                  = "#00262f"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#0e3640"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#113841"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#305156"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#268bd2"

"icon.folder"                        = "#839496"
"icon.php"                           = "#268bd2"
"icon.html"                          = "#cb4b16"
"icon.javascript"                    = "#b58900"
"icon.css"                           = "#268bd2"
"icon.scss"                          = "#6c71c4"
"icon.json"                          = "#b58900"
"icon.yaml"                          = "#dc322f"
"icon.env"                           = "#b58900"
"icon.git"                           = "#cb4b16"
"icon.composer"                      = "#cb4b16"
"icon.npm"                           = "#dc322f"
"icon.lock"                          = "#839496"
"icon.docker"                        = "#2aa198"
"icon.config"                        = "#839496"
"icon.xml"                           = "#cb4b16"
"icon.markdown"                      = "#268bd2"
"icon.text"                          = "#839496"
"icon.twig"                          = "#859900"
"icon.vue"                           = "#859900"
"icon.react"                         = "#2aa198"
"icon.typescript"                    = "#268bd2"
"icon.c"                             = "#268bd2"
"icon.cpp"                           = "#6c71c4"
"icon.lua"                           = "#268bd2"
"icon.zig"                           = "#cb4b16"
"icon.bash"                          = "#859900"
"icon.toml"                          = "#839496"
"icon.dockerfile"                    = "#2aa198"
"icon.database"                      = "#6c71c4"
"icon.shell"                         = "#859900"
"icon.archive"                       = "#cb4b16"
"icon.image"                         = "#6c71c4"
"icon.svg"                           = "#cb4b16"
"icon.file"                          = "#839496"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$purple"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$yellow"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
