# Mocha: one of the built-in themes (generated from its palette).

id = "mocha"
name = "Mocha"
appearance = "dark"

[palette]
base      = "#181825"
card      = "#1e1e2e"
panel     = "#252536"
line      = "#353648"
fg        = "#cdd6f4"
muted     = "#8a8fae"
code      = "#cdd6f4"
accent    = "#cba6f7"
red       = "#f38ba8"
orange    = "#fab387"
green     = "#a6e3a1"
cyan      = "#94e2d5"
blue      = "#89b4fa"
purple    = "#cba6f7"
yellow    = "#f9e2af"
grey      = "#6c7086"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#262736"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#f9e2af"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#5f627b"
"editor.gutter.foreground.active"    = "#acb2d1"
"editor.line.current"                = "#262637"
"editor.selection"                   = "#cba6f7"
"editor.selection.inactive"          = "#333446"
"editor.cursor"                      = "#cdd6f4"
"editor.match"                       = "#f9e2af38"
"editor.match.current"               = "#f9e2af8c"

"tab.hover"                          = "#2a2b3c"
"input.background"                   = "$card"
"input.border"                       = "#44465a"
"popup.background"                   = "#252536"
"popup.border"                       = "#3e3f52"
"shadow"                             = "#00000066"
"toggle.active"                      = "#cba6f759"

"tree.selection"                     = "#303042"
"tree.hover"                         = "#28293a"
"tree.indentGuide"                   = "#2c2d3e"

"sidebar.background"                 = "#1b1b2a"
"toolStrip.foreground"               = "#a1a8c6"
"toolStrip.hover"                    = "#2c2d3e"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#1e1e2e"

"searchField.background"             = "#1a1a29"
"searchField.border"                 = "#383a4c"
"searchField.border.focused"         = "#cba6f7"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#cdd6f4"
"terminal.ansi.black"                = "#13131e"
"terminal.ansi.red"                  = "#f38ba8"
"terminal.ansi.green"                = "#a6e3a1"
"terminal.ansi.yellow"               = "#f9e2af"
"terminal.ansi.blue"                 = "#89b4fa"
"terminal.ansi.magenta"              = "#cba6f7"
"terminal.ansi.cyan"                 = "#94e2d5"
"terminal.ansi.white"                = "#aab1cc"
"terminal.ansi.brightBlack"          = "#6c7086"
"terminal.ansi.brightRed"            = "#f5a2b9"
"terminal.ansi.brightGreen"          = "#b8e9b4"
"terminal.ansi.brightYellow"         = "#fae8bf"
"terminal.ansi.brightBlue"           = "#a1c3fb"
"terminal.ansi.brightMagenta"        = "#d5b8f9"
"terminal.ansi.brightCyan"           = "#a9e8dd"
"terminal.ansi.brightWhite"          = "#cdd6f4"

"scrollbar.track"                    = "#28293a"
"scrollbar.thumb"                    = "#414356"
"scrollbar.thumb.active"             = "#56596d"

"tabBar.background"                  = "#1a1a29"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#28293a"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#2a2b3c"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#414356"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#cba6f7"

"icon.folder"                        = "#8a8fae"
"icon.php"                           = "#89b4fa"
"icon.html"                          = "#fab387"
"icon.javascript"                    = "#f9e2af"
"icon.css"                           = "#89b4fa"
"icon.scss"                          = "#cba6f7"
"icon.json"                          = "#f9e2af"
"icon.yaml"                          = "#f38ba8"
"icon.env"                           = "#f9e2af"
"icon.git"                           = "#fab387"
"icon.composer"                      = "#fab387"
"icon.npm"                           = "#f38ba8"
"icon.lock"                          = "#8a8fae"
"icon.docker"                        = "#94e2d5"
"icon.config"                        = "#8a8fae"
"icon.xml"                           = "#fab387"
"icon.markdown"                      = "#89b4fa"
"icon.text"                          = "#8a8fae"
"icon.twig"                          = "#a6e3a1"
"icon.vue"                           = "#a6e3a1"
"icon.react"                         = "#94e2d5"
"icon.typescript"                    = "#89b4fa"
"icon.c"                             = "#89b4fa"
"icon.cpp"                           = "#cba6f7"
"icon.lua"                           = "#89b4fa"
"icon.zig"                           = "#fab387"
"icon.bash"                          = "#a6e3a1"
"icon.toml"                          = "#8a8fae"
"icon.dockerfile"                    = "#94e2d5"
"icon.database"                      = "#cba6f7"
"icon.shell"                         = "#a6e3a1"
"icon.archive"                       = "#fab387"
"icon.image"                         = "#cba6f7"
"icon.svg"                           = "#fab387"
"icon.file"                          = "#8a8fae"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$red"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
