# Neon City: one of the built-in themes (generated from its palette).

id = "neon"
name = "Neon City"
appearance = "dark"

[palette]
base      = "#16161e"
card      = "#1a1b26"
panel     = "#21222e"
line      = "#313341"
fg        = "#c8d3f5"
muted     = "#8088ac"
code      = "#c0caf5"
accent    = "#7aa2f7"
red       = "#f7768e"
orange    = "#ff9e64"
green     = "#9ece6a"
cyan      = "#7dcfff"
blue      = "#7aa2f7"
purple    = "#bb9af7"
yellow    = "#e0af68"
grey      = "#565f89"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#24252f"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#e0af68"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#545974"
"editor.gutter.foreground.active"    = "#a1abce"
"editor.line.current"                = "#22232f"
"editor.selection"                   = "#7aa2f7"
"editor.selection.inactive"          = "#2f313f"
"editor.cursor"                      = "#c8d3f5"
"editor.match"                       = "#e0af6838"
"editor.match.current"               = "#e0af688c"

"tab.hover"                          = "#262834"
"input.background"                   = "$card"
"input.border"                       = "#404354"
"popup.background"                   = "#21222e"
"popup.border"                       = "#393c4b"
"shadow"                             = "#00000066"
"toggle.active"                      = "#7aa2f759"

"tree.selection"                     = "#2b2d3b"
"tree.hover"                         = "#242632"
"tree.indentGuide"                   = "#282a37"

"sidebar.background"                 = "#181822"
"toolStrip.foreground"               = "#959fc3"
"toolStrip.hover"                    = "#282a37"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#1a1b26"

"searchField.background"             = "#181821"
"searchField.border"                 = "#343745"
"searchField.border.focused"         = "#7aa2f7"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#c8d3f5"
"terminal.ansi.black"                = "#121218"
"terminal.ansi.red"                  = "#f7768e"
"terminal.ansi.green"                = "#9ece6a"
"terminal.ansi.yellow"               = "#e0af68"
"terminal.ansi.blue"                 = "#7aa2f7"
"terminal.ansi.magenta"              = "#bb9af7"
"terminal.ansi.cyan"                 = "#7dcfff"
"terminal.ansi.white"                = "#a5aecc"
"terminal.ansi.brightBlack"          = "#565f89"
"terminal.ansi.brightRed"            = "#f991a5"
"terminal.ansi.brightGreen"          = "#b1d888"
"terminal.ansi.brightYellow"         = "#e6bf86"
"terminal.ansi.brightBlue"           = "#95b5f9"
"terminal.ansi.brightMagenta"        = "#c9aef9"
"terminal.ansi.brightCyan"           = "#97d9ff"
"terminal.ansi.brightWhite"          = "#c8d3f5"

"scrollbar.track"                    = "#242632"
"scrollbar.thumb"                    = "#3d404f"
"scrollbar.thumb.active"             = "#525668"

"tabBar.background"                  = "#181821"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#242632"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#262834"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#3d404f"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#7aa2f7"

"icon.folder"                        = "#7a83a8"
"icon.php"                           = "#7aa2f7"
"icon.html"                          = "#ff9e64"
"icon.javascript"                    = "#e0af68"
"icon.css"                           = "#7aa2f7"
"icon.scss"                          = "#bb9af7"
"icon.json"                          = "#e0af68"
"icon.yaml"                          = "#f7768e"
"icon.env"                           = "#e0af68"
"icon.git"                           = "#ff9e64"
"icon.composer"                      = "#ff9e64"
"icon.npm"                           = "#f7768e"
"icon.lock"                          = "#7a83a8"
"icon.docker"                        = "#7dcfff"
"icon.config"                        = "#7a83a8"
"icon.xml"                           = "#ff9e64"
"icon.markdown"                      = "#7aa2f7"
"icon.text"                          = "#7a83a8"
"icon.twig"                          = "#9ece6a"
"icon.vue"                           = "#9ece6a"
"icon.react"                         = "#7dcfff"
"icon.typescript"                    = "#7aa2f7"
"icon.c"                             = "#7aa2f7"
"icon.cpp"                           = "#bb9af7"
"icon.lua"                           = "#7aa2f7"
"icon.zig"                           = "#ff9e64"
"icon.bash"                          = "#9ece6a"
"icon.toml"                          = "#7a83a8"
"icon.dockerfile"                    = "#7dcfff"
"icon.database"                      = "#bb9af7"
"icon.shell"                         = "#9ece6a"
"icon.archive"                       = "#ff9e64"
"icon.image"                         = "#bb9af7"
"icon.svg"                           = "#ff9e64"
"icon.file"                          = "#7a83a8"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$red"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
