# Slate: one of the built-in themes (neutral grey, a classic blue accent, for long hours), generated from its palette.

id = "slate"
name = "Slate"
appearance = "dark"

[palette]
base      = "#1b1d21"
card      = "#212328"
panel     = "#282b31"
line      = "#33363d"
fg        = "#e3e5e8"
muted     = "#8c9199"
code      = "#d4d7dc"
accent    = "#4f8ef7"
red       = "#ef6b73"
orange    = "#e8a065"
green     = "#8cc98a"
cyan      = "#5fc4c4"
blue      = "#6aa8f7"
purple    = "#b98ce6"
yellow    = "#e5c76b"
grey      = "#6c717a"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#2f3135"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#e5c76b"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#5b5d62"
"editor.gutter.foreground.active"    = "#adafb2"
"editor.line.current"                = "#282a2f"
"editor.selection"                   = "#4f8ef7"
"editor.selection.inactive"          = "#323439"
"editor.cursor"                      = "#e3e5e8"
"editor.match"                       = "#e5c76b38"
"editor.match.current"               = "#e5c76b8c"

"tab.hover"                          = "#2b2d32"
"input.background"                   = "$card"
"input.border"                       = "#44464b"
"popup.background"                   = "$panel"
"popup.border"                       = "#404349"
"shadow"                             = "#00000059"
"toggle.active"                      = "#4f8ef759"

"tree.selection"                     = "#303236"
"tree.hover"                         = "#292b30"
"tree.indentGuide"                   = "#2f3135"

"sidebar.background"                 = "#1e2024"
"toolStrip.foreground"               = "#a5a7ab"
"toolStrip.hover"                    = "#313337"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#ffffff"

"searchField.background"             = "#16181b"
"searchField.border"                 = "#34363b"
"searchField.border.focused"         = "#4f8ef7"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#e3e5e8"
"terminal.ansi.black"                = "#1b1d21"
"terminal.ansi.red"                  = "#ef6b73"
"terminal.ansi.green"                = "#8cc98a"
"terminal.ansi.yellow"               = "#e5c76b"
"terminal.ansi.blue"                 = "#6aa8f7"
"terminal.ansi.magenta"              = "#b98ce6"
"terminal.ansi.cyan"                 = "#5fc4c4"
"terminal.ansi.white"                = "#c6c8cb"
"terminal.ansi.brightBlack"          = "#6f7175"
"terminal.ansi.brightRed"            = "#f2868c"
"terminal.ansi.brightGreen"          = "#a1d39f"
"terminal.ansi.brightYellow"         = "#ead186"
"terminal.ansi.brightBlue"           = "#85b8f8"
"terminal.ansi.brightMagenta"        = "#c6a1ea"
"terminal.ansi.brightCyan"           = "#7ccfcf"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#2b2d32"
"scrollbar.thumb"                    = "#404247"
"scrollbar.thumb.active"             = "#55575c"

"tabBar.background"                  = "#1e2024"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#292b30"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#2b2d32"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#484a4e"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#4f8ef7"

"icon.folder"                        = "#8c9199"
"icon.php"                           = "#6aa8f7"
"icon.html"                          = "#e8a065"
"icon.javascript"                    = "#e5c76b"
"icon.css"                           = "#6aa8f7"
"icon.scss"                          = "#b98ce6"
"icon.json"                          = "#e5c76b"
"icon.yaml"                          = "#ef6b73"
"icon.env"                           = "#e5c76b"
"icon.git"                           = "#e8a065"
"icon.composer"                      = "#e8a065"
"icon.npm"                           = "#ef6b73"
"icon.lock"                          = "#8c9199"
"icon.docker"                        = "#5fc4c4"
"icon.config"                        = "#8c9199"
"icon.xml"                           = "#e8a065"
"icon.markdown"                      = "#6aa8f7"
"icon.text"                          = "#8c9199"
"icon.twig"                          = "#8cc98a"
"icon.vue"                           = "#8cc98a"
"icon.react"                         = "#5fc4c4"
"icon.typescript"                    = "#6aa8f7"
"icon.c"                             = "#6aa8f7"
"icon.cpp"                           = "#b98ce6"
"icon.lua"                           = "#6aa8f7"
"icon.zig"                           = "#e8a065"
"icon.bash"                          = "#8cc98a"
"icon.toml"                          = "#8c9199"
"icon.dockerfile"                    = "#5fc4c4"
"icon.database"                      = "#b98ce6"
"icon.shell"                         = "#8cc98a"
"icon.archive"                       = "#e8a065"
"icon.image"                         = "#b98ce6"
"icon.svg"                           = "#e8a065"
"icon.file"                          = "#8c9199"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$orange"
"constant"           = { fg = "$orange", italic = true }
"constant.builtin"   = "$cyan"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$red"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$red"
"attribute"          = "$orange"
"punctuation"        = "$code"
"property.json"      = "$red"
"property.yaml"      = "$purple"
"boolean"            = "$cyan"
"null"               = "$cyan"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
