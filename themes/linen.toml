# Linen: one of the built-in themes (warm paper white, a terracotta accent), generated from its palette.

id = "linen"
name = "Linen"
appearance = "light"

[palette]
base      = "#ece5da"
card      = "#f8f4ee"
panel     = "#f2ece3"
line      = "#e2d8ca"
fg        = "#3d3530"
muted     = "#766b61"
code      = "#3d3530"
accent    = "#bd5537"
red       = "#bf3b3b"
orange    = "#b9541f"
green     = "#567f32"
cyan      = "#2b7f7b"
blue      = "#36689f"
purple    = "#88509b"
yellow    = "#a5741a"
grey      = "#a09482"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#ebe7e1"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#a5741a"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#c0bbb5"
"editor.gutter.foreground.active"    = "#716a65"
"editor.line.current"                = "#f1ede7"
"editor.selection"                   = "#bd5537"
"editor.selection.inactive"          = "#e7e3dd"
"editor.cursor"                      = "#3d3530"
"editor.match"                       = "#a5741a38"
"editor.match.current"               = "#a5741a8c"

"tab.hover"                          = "#efeae4"
"input.background"                   = "$card"
"input.border"                       = "#d6d2cc"
"popup.background"                   = "#f8f4ee"
"popup.border"                       = "#e0dad1"
"shadow"                             = "#0c090514"
"toggle.active"                      = "#bd553726"

"tree.selection"                     = "#eae6e0"
"tree.hover"                         = "#f1ece6"
"tree.indentGuide"                   = "#ebe7e1"

"sidebar.background"                 = "#f2ece4"
"toolStrip.foreground"               = "#79726d"
"toolStrip.hover"                    = "#e9e5df"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#f8f4ee"

"searchField.background"             = "#f8f4ee"
"searchField.border"                 = "#e5e1db"
"searchField.border.focused"         = "#bd5537"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#3d3530"
"terminal.ansi.black"                = "#1f2328"
"terminal.ansi.red"                  = "#bf3b3b"
"terminal.ansi.green"                = "#567f32"
"terminal.ansi.yellow"               = "#a5741a"
"terminal.ansi.blue"                 = "#36689f"
"terminal.ansi.magenta"              = "#88509b"
"terminal.ansi.cyan"                 = "#2b7f7b"
"terminal.ansi.white"                = "#766b61"
"terminal.ansi.brightBlack"          = "#ada8a2"
"terminal.ansi.brightRed"            = "#9d3030"
"terminal.ansi.brightGreen"          = "#476829"
"terminal.ansi.brightYellow"         = "#875f15"
"terminal.ansi.brightBlue"           = "#2c5582"
"terminal.ansi.brightMagenta"        = "#70427f"
"terminal.ansi.brightCyan"           = "#236865"
"terminal.ansi.brightWhite"          = "#756e69"

"scrollbar.track"                    = "#efeae4"
"scrollbar.thumb"                    = "#dad5d0"
"scrollbar.thumb.active"             = "#c6c0bb"

"tabBar.background"                  = "#f2ece4"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#f1ece6"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#efeae4"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#d3cec8"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#bd5537"

"icon.folder"                        = "#766b61"
"icon.php"                           = "#36689f"
"icon.html"                          = "#b9541f"
"icon.javascript"                    = "#a5741a"
"icon.css"                           = "#36689f"
"icon.scss"                          = "#88509b"
"icon.json"                          = "#a5741a"
"icon.yaml"                          = "#bf3b3b"
"icon.env"                           = "#a5741a"
"icon.git"                           = "#b9541f"
"icon.composer"                      = "#b9541f"
"icon.npm"                           = "#bf3b3b"
"icon.lock"                          = "#766b61"
"icon.docker"                        = "#2b7f7b"
"icon.config"                        = "#766b61"
"icon.xml"                           = "#b9541f"
"icon.markdown"                      = "#36689f"
"icon.text"                          = "#766b61"
"icon.twig"                          = "#567f32"
"icon.vue"                           = "#567f32"
"icon.react"                         = "#2b7f7b"
"icon.typescript"                    = "#36689f"
"icon.c"                             = "#36689f"
"icon.cpp"                           = "#88509b"
"icon.lua"                           = "#36689f"
"icon.zig"                           = "#b9541f"
"icon.bash"                          = "#567f32"
"icon.toml"                          = "#766b61"
"icon.dockerfile"                    = "#2b7f7b"
"icon.database"                      = "#88509b"
"icon.shell"                         = "#567f32"
"icon.archive"                       = "#b9541f"
"icon.image"                         = "#88509b"
"icon.svg"                           = "#b9541f"
"icon.file"                          = "#766b61"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$blue"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$purple"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$code"
"tag"                = "$red"
"attribute"          = "$yellow"
"punctuation"        = "$code"
"property.json"      = "$cyan"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
