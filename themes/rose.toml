# Rosé: one of the built-in themes (generated from its palette).

id = "rose"
name = "Rosé"
appearance = "dark"

[palette]
base      = "#14121c"
card      = "#191724"
panel     = "#211f2c"
line      = "#33313f"
fg        = "#e0def4"
muted     = "#908caa"
code      = "#e0def4"
accent    = "#ebbcba"
red       = "#eb6f92"
orange    = "#f6c177"
green     = "#9ccfd8"
cyan      = "#9ccfd8"
blue      = "#31748f"
purple    = "#c4a7e7"
yellow    = "#f6c177"
grey      = "#6e6a86"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#24222d"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#f6c177"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#605d74"
"editor.gutter.foreground.active"    = "#b8b5cf"
"editor.line.current"                = "#22202d"
"editor.selection"                   = "#ebbcba"
"editor.selection.inactive"          = "#312f3d"
"editor.cursor"                      = "#e0def4"
"editor.match"                       = "#f6c17738"
"editor.match.current"               = "#f6c1778c"

"tab.hover"                          = "#272533"
"input.background"                   = "$card"
"input.border"                       = "#454352"
"popup.background"                   = "#211f2c"
"popup.border"                       = "#3d3b49"
"shadow"                             = "#00000066"
"toggle.active"                      = "#ebbcba59"

"tree.selection"                     = "#2d2b39"
"tree.hover"                         = "#252330"
"tree.indentGuide"                   = "#292735"

"sidebar.background"                 = "#161420"
"toolStrip.foreground"               = "#aca9c4"
"toolStrip.hover"                    = "#292735"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#191724"

"searchField.background"             = "#16141f"
"searchField.border"                 = "#373543"
"searchField.border.focused"         = "#ebbcba"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#e0def4"
"terminal.ansi.black"                = "#100e16"
"terminal.ansi.red"                  = "#eb6f92"
"terminal.ansi.green"                = "#9ccfd8"
"terminal.ansi.yellow"               = "#f6c177"
"terminal.ansi.blue"                 = "#31748f"
"terminal.ansi.magenta"              = "#c4a7e7"
"terminal.ansi.cyan"                 = "#9ccfd8"
"terminal.ansi.white"                = "#b8b6ca"
"terminal.ansi.brightBlack"          = "#6e6a86"
"terminal.ansi.brightRed"            = "#ef8ca8"
"terminal.ansi.brightGreen"          = "#b0d9e0"
"terminal.ansi.brightYellow"         = "#f8cd92"
"terminal.ansi.brightBlue"           = "#5a90a5"
"terminal.ansi.brightMagenta"        = "#d0b9ec"
"terminal.ansi.brightCyan"           = "#b0d9e0"
"terminal.ansi.brightWhite"          = "#e0def4"

"scrollbar.track"                    = "#252330"
"scrollbar.thumb"                    = "#413f4e"
"scrollbar.thumb.active"             = "#595767"

"tabBar.background"                  = "#16141f"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#252330"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#272533"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#413f4e"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#ebbcba"

"icon.folder"                        = "#908caa"
"icon.php"                           = "#31748f"
"icon.html"                          = "#f6c177"
"icon.javascript"                    = "#f6c177"
"icon.css"                           = "#31748f"
"icon.scss"                          = "#c4a7e7"
"icon.json"                          = "#f6c177"
"icon.yaml"                          = "#eb6f92"
"icon.env"                           = "#f6c177"
"icon.git"                           = "#f6c177"
"icon.composer"                      = "#f6c177"
"icon.npm"                           = "#eb6f92"
"icon.lock"                          = "#908caa"
"icon.docker"                        = "#9ccfd8"
"icon.config"                        = "#908caa"
"icon.xml"                           = "#f6c177"
"icon.markdown"                      = "#31748f"
"icon.text"                          = "#908caa"
"icon.twig"                          = "#9ccfd8"
"icon.vue"                           = "#9ccfd8"
"icon.react"                         = "#9ccfd8"
"icon.typescript"                    = "#31748f"
"icon.c"                             = "#31748f"
"icon.cpp"                           = "#c4a7e7"
"icon.lua"                           = "#31748f"
"icon.zig"                           = "#f6c177"
"icon.bash"                          = "#9ccfd8"
"icon.toml"                          = "#908caa"
"icon.dockerfile"                    = "#9ccfd8"
"icon.database"                      = "#c4a7e7"
"icon.shell"                         = "#9ccfd8"
"icon.archive"                       = "#f6c177"
"icon.image"                         = "#c4a7e7"
"icon.svg"                           = "#f6c177"
"icon.file"                          = "#908caa"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$yellow"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
