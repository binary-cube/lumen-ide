# Latte: one of the built-in themes (generated from its palette).

id = "latte"
name = "Latte"
appearance = "light"

[palette]
base      = "#e6e9ef"
card      = "#eff1f5"
panel     = "#eaedf2"
line      = "#dfe1e7"
fg        = "#4c4f69"
muted     = "#65687b"
code      = "#4c4f69"
accent    = "#8839ef"
red       = "#d20f39"
orange    = "#fe640b"
green     = "#40a02b"
cyan      = "#179299"
blue      = "#1e66f5"
purple    = "#8839ef"
yellow    = "#df8e1d"
grey      = "#9ca0b0"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#dadde4"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#be7919"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#aaadba"
"editor.gutter.foreground.active"    = "#64677e"
"editor.line.current"                = "#eaecf1"
"editor.selection"                   = "#8839ef"
"editor.selection.inactive"          = "#e2e4ea"
"editor.cursor"                      = "#4c4f69"
"editor.match"                       = "#df8e1d38"
"editor.match.current"               = "#df8e1d8c"

"tab.hover"                          = "#e4e6eb"
"input.background"                   = "$card"
"input.border"                       = "#d8dae1"
"popup.background"                   = "#eff1f5"
"popup.border"                       = "#dfe1e7"
"shadow"                             = "#0c090514"
"toggle.active"                      = "#8839ef26"

"tree.selection"                     = "#e4e6eb"
"tree.hover"                         = "#e8eaef"
"tree.indentGuide"                   = "#e2e4ea"

"sidebar.background"                 = "#eceef3"
"toolStrip.foreground"               = "#6b6e84"
"toolStrip.hover"                    = "#e2e4ea"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#eff1f5"

"searchField.background"             = "#eff1f5"
"searchField.border"                 = "#dbdee4"
"searchField.border.focused"         = "#8839ef"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#4c4f69"
"terminal.ansi.black"                = "#1f2328"
"terminal.ansi.red"                  = "#d20f39"
"terminal.ansi.green"                = "#40a02b"
"terminal.ansi.yellow"               = "#df8e1d"
"terminal.ansi.blue"                 = "#1e66f5"
"terminal.ansi.magenta"              = "#8839ef"
"terminal.ansi.cyan"                 = "#179299"
"terminal.ansi.white"                = "#6d6f85"
"terminal.ansi.brightBlack"          = "#8c909e"
"terminal.ansi.brightRed"            = "#c53957"
"terminal.ansi.brightGreen"          = "#5ca14c"
"terminal.ansi.brightYellow"         = "#ce9443"
"terminal.ansi.brightBlue"           = "#4478de"
"terminal.ansi.brightMagenta"        = "#9057da"
"terminal.ansi.brightCyan"           = "#3e979c"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#e5e7ed"
"scrollbar.thumb"                    = "#d2d4dc"
"scrollbar.thumb.active"             = "#bec0cb"

"tabBar.background"                  = "#eaecf1"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#e5e7ed"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#e4e6eb"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#ced1d9"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#8839ef"

"icon.folder"                        = "#7c7f93"
"icon.php"                           = "#1e66f5"
"icon.html"                          = "#fe640b"
"icon.javascript"                    = "#df8e1d"
"icon.css"                           = "#1e66f5"
"icon.scss"                          = "#8839ef"
"icon.json"                          = "#df8e1d"
"icon.yaml"                          = "#d20f39"
"icon.env"                           = "#df8e1d"
"icon.git"                           = "#fe640b"
"icon.composer"                      = "#fe640b"
"icon.npm"                           = "#d20f39"
"icon.lock"                          = "#7c7f93"
"icon.docker"                        = "#179299"
"icon.config"                        = "#7c7f93"
"icon.xml"                           = "#fe640b"
"icon.markdown"                      = "#1e66f5"
"icon.text"                          = "#7c7f93"
"icon.twig"                          = "#40a02b"
"icon.vue"                           = "#40a02b"
"icon.react"                         = "#179299"
"icon.typescript"                    = "#1e66f5"
"icon.c"                             = "#1e66f5"
"icon.cpp"                           = "#8839ef"
"icon.lua"                           = "#1e66f5"
"icon.zig"                           = "#fe640b"
"icon.bash"                          = "#40a02b"
"icon.toml"                          = "#7c7f93"
"icon.dockerfile"                    = "#179299"
"icon.database"                      = "#8839ef"
"icon.shell"                         = "#40a02b"
"icon.archive"                       = "#fe640b"
"icon.image"                         = "#8839ef"
"icon.svg"                           = "#fe640b"
"icon.file"                          = "#7c7f93"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$blue"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$code"
"tag"                = "$red"
"attribute"          = "$orange"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
