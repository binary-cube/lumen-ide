# Ink: one of the built-in themes (generated from its palette).

id = "ink"
name = "Ink"
appearance = "dark"

[palette]
base      = "#1e1f1a"
card      = "#272822"
panel     = "#2f302a"
line      = "#42433d"
fg        = "#f8f8f2"
muted     = "#a6a28c"
code      = "#f8f8f2"
accent    = "#a6e22e"
red       = "#f92672"
orange    = "#fd971f"
green     = "#a6e22e"
cyan      = "#66d9ef"
blue      = "#66d9ef"
purple    = "#ae81ff"
yellow    = "#e6db74"
grey      = "#75715e"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#2f302b"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#e6db74"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#737162"
"editor.gutter.foreground.active"    = "#cfcdbf"
"editor.line.current"                = "#30312b"
"editor.selection"                   = "#a6e22e"
"editor.selection.inactive"          = "#40413b"
"editor.cursor"                      = "#f8f8f2"
"editor.match"                       = "#e6db7438"
"editor.match.current"               = "#e6db748c"

"tab.hover"                          = "#363731"
"input.background"                   = "$card"
"input.border"                       = "#555650"
"popup.background"                   = "#2f302a"
"popup.border"                       = "#4d4d47"
"shadow"                             = "#00000066"
"toggle.active"                      = "#a6e22e59"

"tree.selection"                     = "#3c3d37"
"tree.hover"                         = "#34342e"
"tree.indentGuide"                   = "#383933"

"sidebar.background"                 = "#22241e"
"toolStrip.foreground"               = "#c3c0b0"
"toolStrip.hover"                    = "#383933"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#ffffff"

"searchField.background"             = "#22231d"
"searchField.border"                 = "#464741"
"searchField.border.focused"         = "#a6e22e"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#f8f8f2"
"terminal.ansi.black"                = "#181915"
"terminal.ansi.red"                  = "#f92672"
"terminal.ansi.green"                = "#a6e22e"
"terminal.ansi.yellow"               = "#e6db74"
"terminal.ansi.blue"                 = "#66d9ef"
"terminal.ansi.magenta"              = "#ae81ff"
"terminal.ansi.cyan"                 = "#66d9ef"
"terminal.ansi.white"                = "#cecec8"
"terminal.ansi.brightBlack"          = "#75715e"
"terminal.ansi.brightRed"            = "#fa518e"
"terminal.ansi.brightGreen"          = "#b8e858"
"terminal.ansi.brightYellow"         = "#ebe290"
"terminal.ansi.brightBlue"           = "#85e1f2"
"terminal.ansi.brightMagenta"        = "#be9aff"
"terminal.ansi.brightCyan"           = "#85e1f2"
"terminal.ansi.brightWhite"          = "#f8f8f2"

"scrollbar.track"                    = "#34342e"
"scrollbar.thumb"                    = "#51524c"
"scrollbar.thumb.active"             = "#6a6b65"

"tabBar.background"                  = "#22231d"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#34342e"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#363731"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#51524c"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#a6e22e"

"icon.folder"                        = "#a6a28c"
"icon.php"                           = "#66d9ef"
"icon.html"                          = "#fd971f"
"icon.javascript"                    = "#e6db74"
"icon.css"                           = "#66d9ef"
"icon.scss"                          = "#ae81ff"
"icon.json"                          = "#e6db74"
"icon.yaml"                          = "#f92672"
"icon.env"                           = "#e6db74"
"icon.git"                           = "#fd971f"
"icon.composer"                      = "#fd971f"
"icon.npm"                           = "#f92672"
"icon.lock"                          = "#a6a28c"
"icon.docker"                        = "#66d9ef"
"icon.config"                        = "#a6a28c"
"icon.xml"                           = "#fd971f"
"icon.markdown"                      = "#66d9ef"
"icon.text"                          = "#a6a28c"
"icon.twig"                          = "#a6e22e"
"icon.vue"                           = "#a6e22e"
"icon.react"                         = "#66d9ef"
"icon.typescript"                    = "#66d9ef"
"icon.c"                             = "#66d9ef"
"icon.cpp"                           = "#ae81ff"
"icon.lua"                           = "#66d9ef"
"icon.zig"                           = "#fd971f"
"icon.bash"                          = "#a6e22e"
"icon.toml"                          = "#a6a28c"
"icon.dockerfile"                    = "#66d9ef"
"icon.database"                      = "#ae81ff"
"icon.shell"                         = "#a6e22e"
"icon.archive"                       = "#fd971f"
"icon.image"                         = "#ae81ff"
"icon.svg"                           = "#fd971f"
"icon.file"                          = "#a6a28c"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$yellow"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
