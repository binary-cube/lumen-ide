# Ocean: one of the built-in themes (generated from its palette).

id = "ocean"
name = "Ocean"
appearance = "dark"

[palette]
base      = "#0b1524"
card      = "#0f1c2e"
panel     = "#172436"
line      = "#2a3648"
fg        = "#dbe7f5"
muted     = "#7f93ad"
code      = "#cfdcec"
accent    = "#4fc3f7"
red       = "#ff7a90"
orange    = "#ffb070"
green     = "#8bd49c"
cyan      = "#5fd3e3"
blue      = "#6fa8ff"
purple    = "#b49cff"
yellow    = "#ffd479"
grey      = "#5b6f8a"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#1c2635"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#ffd479"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#52637a"
"editor.gutter.foreground.active"    = "#adbdd1"
"editor.line.current"                = "#182537"
"editor.selection"                   = "#4fc3f7"
"editor.selection.inactive"          = "#273446"
"editor.cursor"                      = "#dbe7f5"
"editor.match"                       = "#ffd47938"
"editor.match.current"               = "#ffd4798c"

"tab.hover"                          = "#1d2a3c"
"input.background"                   = "$card"
"input.border"                       = "#3c495a"
"popup.background"                   = "#172436"
"popup.border"                       = "#344152"
"shadow"                             = "#00000066"
"toggle.active"                      = "#4fc3f759"

"tree.selection"                     = "#233042"
"tree.hover"                         = "#1b283a"
"tree.indentGuide"                   = "#1f2c3e"

"sidebar.background"                 = "#0d1829"
"toolStrip.foreground"               = "#9fb0c6"
"toolStrip.hover"                    = "#1f2c3e"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#0f1c2e"

"searchField.background"             = "#0d1828"
"searchField.border"                 = "#2e3a4c"
"searchField.border.focused"         = "#4fc3f7"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#dbe7f5"
"terminal.ansi.black"                = "#09111d"
"terminal.ansi.red"                  = "#ff7a90"
"terminal.ansi.green"                = "#8bd49c"
"terminal.ansi.yellow"               = "#ffd479"
"terminal.ansi.blue"                 = "#6fa8ff"
"terminal.ansi.magenta"              = "#b49cff"
"terminal.ansi.cyan"                 = "#5fd3e3"
"terminal.ansi.white"                = "#b2becd"
"terminal.ansi.brightBlack"          = "#5b6f8a"
"terminal.ansi.brightRed"            = "#ff95a6"
"terminal.ansi.brightGreen"          = "#a2ddb0"
"terminal.ansi.brightYellow"         = "#ffdd94"
"terminal.ansi.brightBlue"           = "#8cb9ff"
"terminal.ansi.brightMagenta"        = "#c3b0ff"
"terminal.ansi.brightCyan"           = "#7fdce9"
"terminal.ansi.brightWhite"          = "#dbe7f5"

"scrollbar.track"                    = "#1b283a"
"scrollbar.thumb"                    = "#384556"
"scrollbar.thumb.active"             = "#505d6e"

"tabBar.background"                  = "#0d1828"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#1b283a"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#1d2a3c"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#384556"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#4fc3f7"

"icon.folder"                        = "#7f93ad"
"icon.php"                           = "#6fa8ff"
"icon.html"                          = "#ffb070"
"icon.javascript"                    = "#ffd479"
"icon.css"                           = "#6fa8ff"
"icon.scss"                          = "#b49cff"
"icon.json"                          = "#ffd479"
"icon.yaml"                          = "#ff7a90"
"icon.env"                           = "#ffd479"
"icon.git"                           = "#ffb070"
"icon.composer"                      = "#ffb070"
"icon.npm"                           = "#ff7a90"
"icon.lock"                          = "#7f93ad"
"icon.docker"                        = "#5fd3e3"
"icon.config"                        = "#7f93ad"
"icon.xml"                           = "#ffb070"
"icon.markdown"                      = "#6fa8ff"
"icon.text"                          = "#7f93ad"
"icon.twig"                          = "#8bd49c"
"icon.vue"                           = "#8bd49c"
"icon.react"                         = "#5fd3e3"
"icon.typescript"                    = "#6fa8ff"
"icon.c"                             = "#6fa8ff"
"icon.cpp"                           = "#b49cff"
"icon.lua"                           = "#6fa8ff"
"icon.zig"                           = "#ffb070"
"icon.bash"                          = "#8bd49c"
"icon.toml"                          = "#7f93ad"
"icon.dockerfile"                    = "#5fd3e3"
"icon.database"                      = "#b49cff"
"icon.shell"                         = "#8bd49c"
"icon.archive"                       = "#ffb070"
"icon.image"                         = "#b49cff"
"icon.svg"                           = "#ffb070"
"icon.file"                          = "#7f93ad"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$purple"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$yellow"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
