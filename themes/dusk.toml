# Dusk: one of the built-in themes (deep navy, a violet accent, cyan and pink syntax), generated from its palette.

id = "dusk"
name = "Dusk"
appearance = "dark"

[palette]
base      = "#13111f"
card      = "#1a1829"
panel     = "#221f35"
line      = "#2e2a45"
fg        = "#e6e3f5"
muted     = "#8f8aab"
code      = "#d9d5ee"
accent    = "#a78bfa"
red       = "#f47f9a"
orange    = "#f5a97f"
green     = "#9ad7a0"
cyan      = "#67d8e6"
blue      = "#7aa2f7"
purple    = "#c39bf5"
yellow    = "#f2d58b"
grey      = "#6b6688"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#282637"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#f2d58b"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#575566"
"editor.gutter.foreground.active"    = "#adaabc"
"editor.line.current"                = "#211f30"
"editor.selection"                   = "#a78bfa"
"editor.selection.inactive"          = "#2c2a3b"
"editor.cursor"                      = "#e6e3f5"
"editor.match"                       = "#f2d58b38"
"editor.match.current"               = "#f2d58b8c"

"tab.hover"                          = "#242233"
"input.background"                   = "$card"
"input.border"                       = "#3f3d4e"
"popup.background"                   = "$panel"
"popup.border"                       = "#3b384e"
"shadow"                             = "#00000059"
"toggle.active"                      = "#a78bfa59"

"tree.selection"                     = "#292738"
"tree.hover"                         = "#222031"
"tree.indentGuide"                   = "#282637"

"sidebar.background"                 = "#161424"
"toolStrip.foreground"               = "#a5a2b4"
"toolStrip.hover"                    = "#2a2839"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#ffffff"

"searchField.background"             = "#100e19"
"searchField.border"                 = "#2e2c3d"
"searchField.border.focused"         = "#a78bfa"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#e6e3f5"
"terminal.ansi.black"                = "#13111f"
"terminal.ansi.red"                  = "#f47f9a"
"terminal.ansi.green"                = "#9ad7a0"
"terminal.ansi.yellow"               = "#f2d58b"
"terminal.ansi.blue"                 = "#7aa2f7"
"terminal.ansi.magenta"              = "#c39bf5"
"terminal.ansi.cyan"                 = "#67d8e6"
"terminal.ansi.white"                = "#c7c5d6"
"terminal.ansi.brightBlack"          = "#6c697b"
"terminal.ansi.brightRed"            = "#f696ac"
"terminal.ansi.brightGreen"          = "#acdeb1"
"terminal.ansi.brightYellow"         = "#f4dda0"
"terminal.ansi.brightBlue"           = "#92b3f8"
"terminal.ansi.brightMagenta"        = "#ceadf7"
"terminal.ansi.brightCyan"           = "#82dfea"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#242233"
"scrollbar.thumb"                    = "#3b384a"
"scrollbar.thumb.active"             = "#514f60"

"tabBar.background"                  = "#161424"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#222031"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#242233"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#434152"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#a78bfa"

"icon.folder"                        = "#8f8aab"
"icon.php"                           = "#7aa2f7"
"icon.html"                          = "#f5a97f"
"icon.javascript"                    = "#f2d58b"
"icon.css"                           = "#7aa2f7"
"icon.scss"                          = "#c39bf5"
"icon.json"                          = "#f2d58b"
"icon.yaml"                          = "#f47f9a"
"icon.env"                           = "#f2d58b"
"icon.git"                           = "#f5a97f"
"icon.composer"                      = "#f5a97f"
"icon.npm"                           = "#f47f9a"
"icon.lock"                          = "#8f8aab"
"icon.docker"                        = "#67d8e6"
"icon.config"                        = "#8f8aab"
"icon.xml"                           = "#f5a97f"
"icon.markdown"                      = "#7aa2f7"
"icon.text"                          = "#8f8aab"
"icon.twig"                          = "#9ad7a0"
"icon.vue"                           = "#9ad7a0"
"icon.react"                         = "#67d8e6"
"icon.typescript"                    = "#7aa2f7"
"icon.c"                             = "#7aa2f7"
"icon.cpp"                           = "#c39bf5"
"icon.lua"                           = "#7aa2f7"
"icon.zig"                           = "#f5a97f"
"icon.bash"                          = "#9ad7a0"
"icon.toml"                          = "#8f8aab"
"icon.dockerfile"                    = "#67d8e6"
"icon.database"                      = "#c39bf5"
"icon.shell"                         = "#9ad7a0"
"icon.archive"                       = "#f5a97f"
"icon.image"                         = "#c39bf5"
"icon.svg"                           = "#f5a97f"
"icon.file"                          = "#8f8aab"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$orange"
"constant"           = { fg = "$orange", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$red"
"attribute"          = "$yellow"
"punctuation"        = "$code"
"property.json"      = "$cyan"
"property.yaml"      = "$purple"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
