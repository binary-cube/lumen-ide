# Mint: one of the built-in themes (generated from its palette).

id = "mint"
name = "Mint"
appearance = "light"

[palette]
base      = "#e9f4ef"
card      = "#f5fbf8"
panel     = "#eff8f4"
line      = "#e0e6e3"
fg        = "#1f2e28"
muted     = "#60726a"
code      = "#24332d"
accent    = "#1f9e75"
red       = "#c8423b"
orange    = "#c86a1c"
green     = "#2e8a3e"
cyan      = "#0f8a8a"
blue      = "#2b6bc4"
purple    = "#8a4bc4"
yellow    = "#9a7a00"
grey      = "#97aaa1"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#d9e4df"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#836800"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#a2b1aa"
"editor.gutter.foreground.active"    = "#45564f"
"editor.line.current"                = "#eff5f2"
"editor.selection"                   = "#1f9e75"
"editor.selection.inactive"          = "#e4ebe7"
"editor.cursor"                      = "#1f2e28"
"editor.match"                       = "#9a7a0038"
"editor.match.current"               = "#9a7a008c"

"tab.hover"                          = "#e6ede9"
"input.background"                   = "$card"
"input.border"                       = "#d7dedb"
"popup.background"                   = "#f5fbf8"
"popup.border"                       = "#e0e6e3"
"shadow"                             = "#0c090514"
"toggle.active"                      = "#1f9e7526"

"tree.selection"                     = "#e6ede9"
"tree.hover"                         = "#ebf2ef"
"tree.indentGuide"                   = "#e4ebe7"

"sidebar.background"                 = "#f1f9f5"
"toolStrip.foreground"               = "#50635b"
"toolStrip.hover"                    = "#e4ebe7"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#f5fbf8"

"searchField.background"             = "#f5fbf8"
"searchField.border"                 = "#dbe2df"
"searchField.border.focused"         = "#1f9e75"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#1f2e28"
"terminal.ansi.black"                = "#1f2328"
"terminal.ansi.red"                  = "#c8423b"
"terminal.ansi.green"                = "#2e8a3e"
"terminal.ansi.yellow"               = "#9a7a00"
"terminal.ansi.blue"                 = "#2b6bc4"
"terminal.ansi.magenta"              = "#8a4bc4"
"terminal.ansi.cyan"                 = "#0f8a8a"
"terminal.ansi.white"                = "#4a5752"
"terminal.ansi.brightBlack"          = "#889991"
"terminal.ansi.brightRed"            = "#be5e58"
"terminal.ansi.brightGreen"          = "#4f915b"
"terminal.ansi.brightYellow"         = "#9d862e"
"terminal.ansi.brightBlue"           = "#4c7bbb"
"terminal.ansi.brightMagenta"        = "#9164bb"
"terminal.ansi.brightCyan"           = "#399191"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#e8efec"
"scrollbar.thumb"                    = "#ced6d3"
"scrollbar.thumb.active"             = "#b5beba"

"tabBar.background"                  = "#eef7f3"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#e8efec"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#e6ede9"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#cad2ce"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#1f9e75"

"icon.folder"                        = "#6b7f76"
"icon.php"                           = "#2b6bc4"
"icon.html"                          = "#c86a1c"
"icon.javascript"                    = "#9a7a00"
"icon.css"                           = "#2b6bc4"
"icon.scss"                          = "#8a4bc4"
"icon.json"                          = "#9a7a00"
"icon.yaml"                          = "#c8423b"
"icon.env"                           = "#9a7a00"
"icon.git"                           = "#c86a1c"
"icon.composer"                      = "#c86a1c"
"icon.npm"                           = "#c8423b"
"icon.lock"                          = "#6b7f76"
"icon.docker"                        = "#0f8a8a"
"icon.config"                        = "#6b7f76"
"icon.xml"                           = "#c86a1c"
"icon.markdown"                      = "#2b6bc4"
"icon.text"                          = "#6b7f76"
"icon.twig"                          = "#2e8a3e"
"icon.vue"                           = "#2e8a3e"
"icon.react"                         = "#0f8a8a"
"icon.typescript"                    = "#2b6bc4"
"icon.c"                             = "#2b6bc4"
"icon.cpp"                           = "#8a4bc4"
"icon.lua"                           = "#2b6bc4"
"icon.zig"                           = "#c86a1c"
"icon.bash"                          = "#2e8a3e"
"icon.toml"                          = "#6b7f76"
"icon.dockerfile"                    = "#0f8a8a"
"icon.database"                      = "#8a4bc4"
"icon.shell"                         = "#2e8a3e"
"icon.archive"                       = "#c86a1c"
"icon.image"                         = "#8a4bc4"
"icon.svg"                           = "#c86a1c"
"icon.file"                          = "#6b7f76"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$blue"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$purple"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$code"
"tag"                = "$red"
"attribute"          = "$orange"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
