# Onyx: one of the built-in themes (generated from its palette).

id = "onyx"
name = "Onyx"
appearance = "dark"

[palette]
base      = "#0e0e0e"
card      = "#141414"
panel     = "#1c1c1c"
line      = "#2f2f2f"
fg        = "#e6e6e6"
muted     = "#8c8c8c"
code      = "#d4d4d4"
accent    = "#4f9dff"
red       = "#ff6b6b"
orange    = "#ffa94d"
green     = "#8ce99a"
cyan      = "#66d9e8"
blue      = "#74c0fc"
purple    = "#da77f2"
yellow    = "#ffd43b"
grey      = "#6e6e6e"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#1f1f1f"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#ffd43b"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#5c5c5c"
"editor.gutter.foreground.active"    = "#b9b9b9"
"editor.line.current"                = "#1d1d1d"
"editor.selection"                   = "#4f9dff"
"editor.selection.inactive"          = "#2d2d2d"
"editor.cursor"                      = "#e6e6e6"
"editor.match"                       = "#ffd43b38"
"editor.match.current"               = "#ffd43b8c"

"tab.hover"                          = "#232323"
"input.background"                   = "$card"
"input.border"                       = "#424242"
"popup.background"                   = "#1c1c1c"
"popup.border"                       = "#3a3a3a"
"shadow"                             = "#00000066"
"toggle.active"                      = "#4f9dff59"

"tree.selection"                     = "#292929"
"tree.hover"                         = "#212121"
"tree.indentGuide"                   = "#252525"

"sidebar.background"                 = "#111111"
"toolStrip.foreground"               = "#acacac"
"toolStrip.hover"                    = "#252525"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#141414"

"searchField.background"             = "#101010"
"searchField.border"                 = "#343434"
"searchField.border.focused"         = "#4f9dff"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#e6e6e6"
"terminal.ansi.black"                = "#0b0b0b"
"terminal.ansi.red"                  = "#ff6b6b"
"terminal.ansi.green"                = "#8ce99a"
"terminal.ansi.yellow"               = "#ffd43b"
"terminal.ansi.blue"                 = "#74c0fc"
"terminal.ansi.magenta"              = "#da77f2"
"terminal.ansi.cyan"                 = "#66d9e8"
"terminal.ansi.white"                = "#bcbcbc"
"terminal.ansi.brightBlack"          = "#6e6e6e"
"terminal.ansi.brightRed"            = "#ff8989"
"terminal.ansi.brightGreen"          = "#a3edae"
"terminal.ansi.brightYellow"         = "#ffdd62"
"terminal.ansi.brightBlue"           = "#90cdfd"
"terminal.ansi.brightMagenta"        = "#e192f5"
"terminal.ansi.brightCyan"           = "#85e1ed"
"terminal.ansi.brightWhite"          = "#e6e6e6"

"scrollbar.track"                    = "#212121"
"scrollbar.thumb"                    = "#3e3e3e"
"scrollbar.thumb.active"             = "#575757"

"tabBar.background"                  = "#101010"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#212121"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#232323"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#3e3e3e"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#4f9dff"

"icon.folder"                        = "#8c8c8c"
"icon.php"                           = "#74c0fc"
"icon.html"                          = "#ffa94d"
"icon.javascript"                    = "#ffd43b"
"icon.css"                           = "#74c0fc"
"icon.scss"                          = "#da77f2"
"icon.json"                          = "#ffd43b"
"icon.yaml"                          = "#ff6b6b"
"icon.env"                           = "#ffd43b"
"icon.git"                           = "#ffa94d"
"icon.composer"                      = "#ffa94d"
"icon.npm"                           = "#ff6b6b"
"icon.lock"                          = "#8c8c8c"
"icon.docker"                        = "#66d9e8"
"icon.config"                        = "#8c8c8c"
"icon.xml"                           = "#ffa94d"
"icon.markdown"                      = "#74c0fc"
"icon.text"                          = "#8c8c8c"
"icon.twig"                          = "#8ce99a"
"icon.vue"                           = "#8ce99a"
"icon.react"                         = "#66d9e8"
"icon.typescript"                    = "#74c0fc"
"icon.c"                             = "#74c0fc"
"icon.cpp"                           = "#da77f2"
"icon.lua"                           = "#74c0fc"
"icon.zig"                           = "#ffa94d"
"icon.bash"                          = "#8ce99a"
"icon.toml"                          = "#8c8c8c"
"icon.dockerfile"                    = "#66d9e8"
"icon.database"                      = "#da77f2"
"icon.shell"                         = "#8ce99a"
"icon.archive"                       = "#ffa94d"
"icon.image"                         = "#da77f2"
"icon.svg"                           = "#ffa94d"
"icon.file"                          = "#8c8c8c"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$orange"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$cyan"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$purple"
"property"           = "$purple"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$yellow"
"tag"                = "$yellow"
"attribute"          = "$code"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
