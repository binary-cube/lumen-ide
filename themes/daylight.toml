# Daylight: one of the built-in themes (generated from its palette).

id = "daylight"
name = "Daylight"
appearance = "light"

[palette]
base      = "#f6f8fa"
card      = "#ffffff"
panel     = "#fafcfc"
line      = "#e9e9ea"
fg        = "#1f2328"
muted     = "#656d76"
code      = "#1f2328"
accent    = "#0969da"
red       = "#cf222e"
orange    = "#bc4c00"
green     = "#116329"
cyan      = "#0a7a7a"
blue      = "#0550ae"
purple    = "#8250df"
yellow    = "#7d4e00"
grey      = "#8c959f"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#e5e7e9"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#6a4200"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#a3a7ad"
"editor.gutter.foreground.active"    = "#42484f"
"editor.line.current"                = "#f8f8f9"
"editor.selection"                   = "#0969da"
"editor.selection.inactive"          = "#ededee"
"editor.cursor"                      = "#1f2328"
"editor.match"                       = "#7d4e0038"
"editor.match.current"               = "#7d4e008c"

"tab.hover"                          = "#eff0f0"
"input.background"                   = "$card"
"input.border"                       = "#e0e0e1"
"popup.background"                   = "#ffffff"
"popup.border"                       = "#e9e9ea"
"shadow"                             = "#0c090514"
"toggle.active"                      = "#0969da26"

"tree.selection"                     = "#eff0f0"
"tree.hover"                         = "#f5f5f5"
"tree.indentGuide"                   = "#ededee"

"sidebar.background"                 = "#fcfdfd"
"toolStrip.foreground"               = "#4c535b"
"toolStrip.hover"                    = "#ededee"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#ffffff"

"searchField.background"             = "#ffffff"
"searchField.border"                 = "#e4e5e5"
"searchField.border.focused"         = "#0969da"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#1f2328"
"terminal.ansi.black"                = "#1f2328"
"terminal.ansi.red"                  = "#cf222e"
"terminal.ansi.green"                = "#116329"
"terminal.ansi.yellow"               = "#7d4e00"
"terminal.ansi.blue"                 = "#0550ae"
"terminal.ansi.magenta"              = "#8250df"
"terminal.ansi.cyan"                 = "#0a7a7a"
"terminal.ansi.white"                = "#4c4f53"
"terminal.ansi.brightBlack"          = "#7e868f"
"terminal.ansi.brightRed"            = "#c3464f"
"terminal.ansi.brightGreen"          = "#3a754c"
"terminal.ansi.brightYellow"         = "#88662e"
"terminal.ansi.brightBlue"           = "#3268ab"
"terminal.ansi.brightMagenta"        = "#8c68ce"
"terminal.ansi.brightCyan"           = "#358686"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#f2f2f2"
"scrollbar.thumb"                    = "#d7d7d8"
"scrollbar.thumb.active"             = "#bcbdbe"

"tabBar.background"                  = "#fafbfc"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#f2f2f2"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#eff0f0"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#d2d3d4"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#0969da"

"icon.folder"                        = "#656d76"
"icon.php"                           = "#0550ae"
"icon.html"                          = "#bc4c00"
"icon.javascript"                    = "#7d4e00"
"icon.css"                           = "#0550ae"
"icon.scss"                          = "#8250df"
"icon.json"                          = "#7d4e00"
"icon.yaml"                          = "#cf222e"
"icon.env"                           = "#7d4e00"
"icon.git"                           = "#bc4c00"
"icon.composer"                      = "#bc4c00"
"icon.npm"                           = "#cf222e"
"icon.lock"                          = "#656d76"
"icon.docker"                        = "#0a7a7a"
"icon.config"                        = "#656d76"
"icon.xml"                           = "#bc4c00"
"icon.markdown"                      = "#0550ae"
"icon.text"                          = "#656d76"
"icon.twig"                          = "#116329"
"icon.vue"                           = "#116329"
"icon.react"                         = "#0a7a7a"
"icon.typescript"                    = "#0550ae"
"icon.c"                             = "#0550ae"
"icon.cpp"                           = "#8250df"
"icon.lua"                           = "#0550ae"
"icon.zig"                           = "#bc4c00"
"icon.bash"                          = "#116329"
"icon.toml"                          = "#656d76"
"icon.dockerfile"                    = "#0a7a7a"
"icon.database"                      = "#8250df"
"icon.shell"                         = "#116329"
"icon.archive"                       = "#bc4c00"
"icon.image"                         = "#8250df"
"icon.svg"                           = "#bc4c00"
"icon.file"                          = "#656d76"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$blue"
"constant"           = { fg = "$purple", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$code"
"tag"                = "$red"
"attribute"          = "$orange"
"punctuation"        = "$code"
"property.json"      = "$blue"
"property.yaml"      = "$orange"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
