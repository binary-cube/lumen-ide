# Fjord: one of the built-in themes (cool blue-grey, an icy blue accent, soft contrast), generated from its palette.

id = "fjord"
name = "Fjord"
appearance = "dark"

[palette]
base      = "#232832"
card      = "#2c323d"
panel     = "#333a47"
line      = "#3b4251"
fg        = "#e4e8ef"
muted     = "#98a2b2"
code      = "#d6dce7"
accent    = "#88bfd0"
red       = "#c8666f"
orange    = "#d38a72"
green     = "#a4c08c"
cyan      = "#8dc1bd"
blue      = "#82a3c4"
purple    = "#b590b0"
yellow    = "#e9cb8d"
grey      = "#717d96"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#393f49"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#e9cb8d"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#636972"
"editor.gutter.foreground.active"    = "#b0b5bd"
"editor.line.current"                = "#323843"
"editor.selection"                   = "#88bfd0"
"editor.selection.inactive"          = "#3d424d"
"editor.cursor"                      = "#e4e8ef"
"editor.match"                       = "#e9cb8d38"
"editor.match.current"               = "#e9cb8d8c"

"tab.hover"                          = "#353b46"
"input.background"                   = "$card"
"input.border"                       = "#4d535d"
"popup.background"                   = "$panel"
"popup.border"                       = "#4a515d"
"shadow"                             = "#00000059"
"toggle.active"                      = "#88bfd059"

"tree.selection"                     = "#3a404a"
"tree.hover"                         = "#333944"
"tree.indentGuide"                   = "#393f49"

"sidebar.background"                 = "#282d38"
"toolStrip.foreground"               = "#a9aeb6"
"toolStrip.hover"                    = "#3b414b"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#ffffff"

"searchField.background"             = "#1d2129"
"searchField.border"                 = "#3e444f"
"searchField.border.focused"         = "#88bfd0"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#e4e8ef"
"terminal.ansi.black"                = "#232832"
"terminal.ansi.red"                  = "#c8666f"
"terminal.ansi.green"                = "#a4c08c"
"terminal.ansi.yellow"               = "#e9cb8d"
"terminal.ansi.blue"                 = "#82a3c4"
"terminal.ansi.magenta"              = "#b590b0"
"terminal.ansi.cyan"                 = "#8dc1bd"
"terminal.ansi.white"                = "#c8cdd4"
"terminal.ansi.brightBlack"          = "#767b84"
"terminal.ansi.brightRed"            = "#d28289"
"terminal.ansi.brightGreen"          = "#b4cba1"
"terminal.ansi.brightYellow"         = "#edd4a2"
"terminal.ansi.brightBlue"           = "#98b4cf"
"terminal.ansi.brightMagenta"        = "#c2a4be"
"terminal.ansi.brightCyan"           = "#a2ccc9"
"terminal.ansi.brightWhite"          = "#ffffff"

"scrollbar.track"                    = "#353b46"
"scrollbar.thumb"                    = "#494f59"
"scrollbar.thumb.active"             = "#5e636d"

"tabBar.background"                  = "#282d38"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#333944"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#353b46"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#515661"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#88bfd0"

"icon.folder"                        = "#929cad"
"icon.php"                           = "#82a3c4"
"icon.html"                          = "#d38a72"
"icon.javascript"                    = "#e9cb8d"
"icon.css"                           = "#82a3c4"
"icon.scss"                          = "#b590b0"
"icon.json"                          = "#e9cb8d"
"icon.yaml"                          = "#c8666f"
"icon.env"                           = "#e9cb8d"
"icon.git"                           = "#d38a72"
"icon.composer"                      = "#d38a72"
"icon.npm"                           = "#c8666f"
"icon.lock"                          = "#929cad"
"icon.docker"                        = "#8dc1bd"
"icon.config"                        = "#929cad"
"icon.xml"                           = "#d38a72"
"icon.markdown"                      = "#82a3c4"
"icon.text"                          = "#929cad"
"icon.twig"                          = "#a4c08c"
"icon.vue"                           = "#a4c08c"
"icon.react"                         = "#8dc1bd"
"icon.typescript"                    = "#82a3c4"
"icon.c"                             = "#82a3c4"
"icon.cpp"                           = "#b590b0"
"icon.lua"                           = "#82a3c4"
"icon.zig"                           = "#d38a72"
"icon.bash"                          = "#a4c08c"
"icon.toml"                          = "#929cad"
"icon.dockerfile"                    = "#8dc1bd"
"icon.database"                      = "#b590b0"
"icon.shell"                         = "#a4c08c"
"icon.archive"                       = "#d38a72"
"icon.image"                         = "#b590b0"
"icon.svg"                           = "#d38a72"
"icon.file"                          = "#929cad"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$blue"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$purple"
"constant"           = { fg = "$yellow", italic = true }
"constant.builtin"   = "$blue"
"variable"           = "$code"
"variable.php"       = "$code"
"property"           = "$cyan"
"function"           = "$accent"
"function.method"    = "$accent"
"type"               = "$yellow"
"tag"                = "$blue"
"attribute"          = "$yellow"
"punctuation"        = "$code"
"property.json"      = "$cyan"
"property.yaml"      = "$blue"
"boolean"            = "$blue"
"null"               = "$blue"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
