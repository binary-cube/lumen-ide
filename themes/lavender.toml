# Lavender: one of the built-in themes (cool white, a lavender accent, quiet syntax), generated from its palette.

id = "lavender"
name = "Lavender"
appearance = "light"

[palette]
base      = "#e9e7f2"
card      = "#f7f6fb"
panel     = "#efedf6"
line      = "#dddae9"
fg        = "#3a3650"
muted     = "#6f6a88"
code      = "#3a3650"
accent    = "#7a5ad4"
red       = "#c4405a"
orange    = "#bf6a2a"
green     = "#3c8856"
cyan      = "#28869a"
blue      = "#3d6bcc"
purple    = "#7a5ad4"
yellow    = "#9d7514"
grey      = "#9d98b2"

[ui]
"window.background"                  = "$base"
"card.border"                        = "#eae9ef"
"panel.background"                   = "$panel"
"border"                             = "$line"
"text"                               = "$fg"
"text.muted"                         = "$muted"
"accent"                             = "$accent"
"danger"                             = "$red"
"warning"                            = "#9d7514"

"editor.background"                  = "$card"
"editor.foreground"                  = "$code"
"editor.gutter.foreground"           = "#bebcc8"
"editor.gutter.foreground.active"    = "#6f6c80"
"editor.line.current"                = "#f0eff5"
"editor.selection"                   = "#7a5ad4"
"editor.selection.inactive"          = "#e6e5ec"
"editor.cursor"                      = "#3a3650"
"editor.match"                       = "#9d751438"
"editor.match.current"               = "#9d75148c"

"tab.hover"                          = "#eeecf2"
"input.background"                   = "$card"
"input.border"                       = "#d5d3dc"
"popup.background"                   = "#f7f6fb"
"popup.border"                       = "#dddbe5"
"shadow"                             = "#0c090514"
"toggle.active"                      = "#7a5ad426"

"tree.selection"                     = "#e9e8ee"
"tree.hover"                         = "#efeef4"
"tree.indentGuide"                   = "#eae9ef"

"sidebar.background"                 = "#f0eef6"
"toolStrip.foreground"               = "#767387"
"toolStrip.hover"                    = "#e8e7ed"
"toolStrip.active.background"        = "$accent"
"toolStrip.active.foreground"        = "#f7f6fb"

"searchField.background"             = "#f7f6fb"
"searchField.border"                 = "#e4e3ea"
"searchField.border.focused"         = "#7a5ad4"

"terminal.background"                = "$card"
"terminal.foreground"                = "$code"
"terminal.cursor"                    = "#3a3650"
"terminal.ansi.black"                = "#1f2328"
"terminal.ansi.red"                  = "#c4405a"
"terminal.ansi.green"                = "#3c8856"
"terminal.ansi.yellow"               = "#9d7514"
"terminal.ansi.blue"                 = "#3d6bcc"
"terminal.ansi.magenta"              = "#7a5ad4"
"terminal.ansi.cyan"                 = "#28869a"
"terminal.ansi.white"                = "#6f6a88"
"terminal.ansi.brightBlack"          = "#aba9b7"
"terminal.ansi.brightRed"            = "#a1344a"
"terminal.ansi.brightGreen"          = "#317047"
"terminal.ansi.brightYellow"         = "#816010"
"terminal.ansi.brightBlue"           = "#3258a7"
"terminal.ansi.brightMagenta"        = "#644aae"
"terminal.ansi.brightCyan"           = "#216e7e"
"terminal.ansi.brightWhite"          = "#737083"

"scrollbar.track"                    = "#eeecf2"
"scrollbar.thumb"                    = "#d9d7e0"
"scrollbar.thumb.active"             = "#c4c2cd"

"tabBar.background"                  = "#f0eef6"
"tab.active.background"              = "$card"
"tab.hover.background"               = "#efeef4"
"tab.active.indicator"               = "$accent"

"splitter.line"                      = "#eeecf2"
"splitter.handle.background"         = "$base"
"splitter.handle.border"             = "#d1d0d9"
"splitter.grip"                      = "$muted"
"splitter.active"                    = "#7a5ad4"

"icon.folder"                        = "#6f6a88"
"icon.php"                           = "#3d6bcc"
"icon.html"                          = "#bf6a2a"
"icon.javascript"                    = "#9d7514"
"icon.css"                           = "#3d6bcc"
"icon.scss"                          = "#7a5ad4"
"icon.json"                          = "#9d7514"
"icon.yaml"                          = "#c4405a"
"icon.env"                           = "#9d7514"
"icon.git"                           = "#bf6a2a"
"icon.composer"                      = "#bf6a2a"
"icon.npm"                           = "#c4405a"
"icon.lock"                          = "#6f6a88"
"icon.docker"                        = "#28869a"
"icon.config"                        = "#6f6a88"
"icon.xml"                           = "#bf6a2a"
"icon.markdown"                      = "#3d6bcc"
"icon.text"                          = "#6f6a88"
"icon.twig"                          = "#3c8856"
"icon.vue"                           = "#3c8856"
"icon.react"                         = "#28869a"
"icon.typescript"                    = "#3d6bcc"
"icon.c"                             = "#3d6bcc"
"icon.cpp"                           = "#7a5ad4"
"icon.lua"                           = "#3d6bcc"
"icon.zig"                           = "#bf6a2a"
"icon.bash"                          = "#3c8856"
"icon.toml"                          = "#6f6a88"
"icon.dockerfile"                    = "#28869a"
"icon.database"                      = "#7a5ad4"
"icon.shell"                         = "#3c8856"
"icon.archive"                       = "#bf6a2a"
"icon.image"                         = "#7a5ad4"
"icon.svg"                           = "#bf6a2a"
"icon.file"                          = "#6f6a88"

[syntax]
"comment"            = { fg = "$grey", italic = true }
"keyword"            = "$purple"
"operator"           = "$code"
"string"             = "$green"
"string.escape"      = "$orange"
"number"             = "$orange"
"constant"           = { fg = "$blue", italic = true }
"constant.builtin"   = "$orange"
"variable"           = "$code"
"variable.php"       = "$red"
"property"           = "$cyan"
"function"           = "$blue"
"function.method"    = "$blue"
"type"               = "$code"
"tag"                = "$red"
"attribute"          = "$orange"
"punctuation"        = "$code"
"property.json"      = "$cyan"
"property.yaml"      = "$purple"
"boolean"            = "$orange"
"null"               = "$orange"

# The windows over the editor and the menu's panel: frosted glass, gently (plan 55k).
[backdrop]
style = "glass"

[floating]
style = "glass"
