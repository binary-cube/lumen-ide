[package]
name = "tree-sitter-http"
description = "HTTP request files grammar for the tree-sitter parsing library (rest-nvim/tree-sitter-http)"
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/rest-nvim/tree-sitter-http"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"
doctest = false
test = false

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"
