[package]
name = "tree-sitter-dotenv"
description = "Dotenv grammar for the tree-sitter parsing library (pnx/tree-sitter-dotenv)"
version = "1.1.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/pnx/tree-sitter-dotenv"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"
doctest = false
test = false

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"
