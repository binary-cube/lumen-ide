[package]
name = "tree-sitter-blade"
description = "Blade (Laravel) grammar for the tree-sitter parsing library"
version = "0.12.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/EmranMR/tree-sitter-blade"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"
