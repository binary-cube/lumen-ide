[package]
name = "tree-sitter-sql"
description = "SQL grammar for the tree-sitter parsing library (DerekStride/tree-sitter-sql)"
version = "0.3.11"
edition = "2021"
license = "MIT"
repository = "https://github.com/DerekStride/tree-sitter-sql"
publish = false
build = "bindings/rust/build.rs"

[lib]
path = "bindings/rust/lib.rs"
doctest = false
test = false

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.0"
