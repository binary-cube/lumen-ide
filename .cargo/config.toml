[alias]
xtask = "run --quiet --package xtask --"

# Building for Windows from macOS / Linux: `cargo build --release --target x86_64-pc-windows-gnu`
# (needs MinGW-w64: `brew install mingw-w64`).
[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# SQLite (compiled in by `libsqlite3-sys`, for every crate using `rusqlite`) with each plan
# element's figures (`sqlite3_stmt_scanstatus_v2`: real loops, rows and cycles per node), for
# the console's profiles (plan 39h2). Collected only while a profile runs
# (`SQLITE_DBCONFIG_STMT_SCANSTATUS`, off otherwise). Measured: +16 KB on macOS, +14 KB on
# Windows.
[env]
LIBSQLITE3_FLAGS = "-DSQLITE_ENABLE_STMT_SCANSTATUS"
