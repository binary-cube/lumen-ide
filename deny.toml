[graph]
all-features = true

[advisories]
yanked = "deny"
# Unmaintained, with no maintained release to move to yet; none is a vulnerability. Each is
# looked at again when its dependents move on.
ignore = [
    # proc-macro-error: glib's macros (GTK, for the native menus on Linux), at build time only.
    { id = "RUSTSEC-2024-0370", reason = "build-time only, through glib-macros (GTK on Linux)" },
    # ttf-parser: fontdb (cosmic-text), reading the fonts installed.
    { id = "RUSTSEC-2026-0192", reason = "through fontdb / cosmic-text; no maintained successor yet" },
    # zvariant, zbus_names, zvariant_derive: zbus, the Secret Service keyring on Linux.
    { id = "RUSTSEC-2026-0370", reason = "through zbus (the Linux keyring); no release to move to yet" },
    { id = "RUSTSEC-2026-0371", reason = "through zbus (the Linux keyring); no release to move to yet" },
    { id = "RUSTSEC-2026-0372", reason = "through zbus (the Linux keyring); no release to move to yet" },
    # chrono: the agents' session dates (and several dependencies); to be replaced.
    { id = "RUSTSEC-2026-0543", reason = "the agents' session dates read with it; to be replaced" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    # Permissive, as the ones above:
    "BSL-1.0",              # clipboard-win, error-code (the Windows clipboard)
    "0BSD",                 # doctest-file, recvmsg (interprocess: a later start's paths)
    "CC0-1.0",              # notify (the disk's changes)
    "CDLA-Permissive-2.0",  # webpki-roots: Mozilla's root certificates, as data
]
confidence-threshold = 0.9

[licenses.private]
ignore = true   # our own crates (publish = false) need no declared license

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
