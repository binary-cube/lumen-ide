name: Language servers

# Brings the language servers' pinned versions up to date every month (plan 46b), like the
# language data's workflow: `cargo xtask lsp-update` looks up the newest release of every
# component of packaging/lsp.toml (Node's newest LTS, static PHP, the Node servers'
# packages, the native servers' and phpactor's GitHub releases, intelephense), pins it
# (SHA-256s, the lockfiles made again by npm with every package's SHA-512) and makes the
# app's download manifest again. Every component is then downloaded from the new manifest
# and the tests run against the real servers; a pull request is opened only when they pass.
#
# Two pull requests: patch / minor updates (`language-servers`), and the major ones
# (`language-servers-major`: a new major version of a server, a new Node LTS line, a new
# PHP minor line), each on its own so the first never waits for the second.
on:
  schedule:
    - cron: "0 7 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    strategy:
      fail-fast: false
      matrix:
        include:
          - kind: minor
            flags: ""
            branch: language-servers
            title: "Language servers update"
          - kind: major
            flags: "--major"
            branch: language-servers-major
            title: "Language servers update (major versions)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      # npm makes the Node servers' lockfiles again (never run by the app).
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Look up and pin the new versions
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo xtask lsp-update ${{ matrix.flags }} | tee "$RUNNER_TEMP/lsp-update.txt"
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: The manifest is the packaging's
        if: steps.update.outputs.changed == 'true'
        run: cargo xtask lsp-manifest --check
      - name: Download every component from the new manifest
        if: steps.update.outputs.changed == 'true'
        run: |
          EDITOR_TEST_LSP_DOWNLOAD="$RUNNER_TEMP/lsp" \
            cargo test -p lsp-client --lib every_component_downloads_from_its_real_source -- --nocapture
      - name: The real servers' tests on what was downloaded
        if: steps.update.outputs.changed == 'true'
        run: |
          EDITOR_LSP_DIR="$RUNNER_TEMP/lsp" \
            cargo test -p lsp-client --lib real_servers -- --test-threads=1
      - name: The language servers' module and the xtask tests
        if: steps.update.outputs.changed == 'true'
        run: cargo test -p language-servers -p xtask
      - name: Pull request body
        if: steps.update.outputs.changed == 'true'
        run: |
          {
            echo "Generated by \`cargo xtask lsp-update ${{ matrix.flags }}\` (plan 46b)."
            echo
            echo "Every component was downloaded from the new manifest and the real servers' tests passed on it."
            echo
            echo '```'
            sed -n '/^lsp-update:$/,$p' "$RUNNER_TEMP/lsp-update.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
      - name: Pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: ${{ matrix.branch }}
          title: ${{ matrix.title }}
          commit-message: ${{ matrix.title }}
          body-path: ${{ runner.temp }}/body.md
