# A release (plan 84a): a tag `v<version>` (the version of Cargo.toml) builds the app for
# macOS (Apple Silicon), Windows and Linux, and makes a DRAFT release with the files,
# SHA256SUMS and latest.json signed (plan 84b). A human reads the notes, edits them, and
# publishes it: the notes are what the app shows as "What's new".
# Run by hand (Actions › Release › Run workflow), it makes the same draft from the branch.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      # The tools' cache, made on main (release-cache.yml): a tag's own is seen by no other.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          save-if: false
      - id: version
        name: The tag is the version
        run: |
          version="$(cargo xtask release-version)"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::the tag $GITHUB_REF_NAME isn't the version of Cargo.toml ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
          - platform: Windows
            os: windows-latest
          - platform: Linux
            # The oldest image still offered: the binary needs the glibc it was built
            # against or newer (the latest image's 2.43 runs only on the newest systems).
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      # Whether the project's signing certificate is there (a secret can't be asked in `if`).
      HAS_MACOS_SIGNING: ${{ secrets.MACOS_SIGNING_P12 != '' }}
      # SignPath (Windows): its token a secret, its organization and project the
      # repository's variables (Settings › Secrets and variables › Actions › Variables).
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      # The dependencies built for release, kept on main by release-cache.yml (the same
      # scripts, the same key): a tag can read main's caches, never another tag's.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ runner.os }}
          # The release profile's settings (Cargo.toml): bumped with them.
          key: profile-v1
          save-if: false
      # The project's signing certificate (MACOS_SIGNING_P12, base64, and its password) in a
      # keychain of this run's: the app signed with it, so macOS knows it from one version
      # to the next. Without the secret: signed ad hoc, as before.
      - name: Signing certificate (macOS)
        if: matrix.os == 'macos-latest' && env.HAS_MACOS_SIGNING == 'true'
        env:
          MACOS_SIGNING_P12: ${{ secrets.MACOS_SIGNING_P12 }}
          MACOS_SIGNING_PASSWORD: ${{ secrets.MACOS_SIGNING_PASSWORD }}
        run: bash scripts/ci/macos-keychain.sh
      - name: Build (macOS, Apple Silicon)
        if: matrix.os == 'macos-latest'
        run: ./scripts/build.sh mac --full
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build.ps1
      # Signed by SignPath (free for open source, certificate by SignPath Foundation): the
      # program sent as it was built here, the request approved by hand in SignPath (its
      # rules: every release's signing approved), the signed program put back in the zip.
      # Without SignPath set up: unsigned, as before.
      - name: The program to sign (Windows)
        id: unsigned
        if: matrix.os == 'windows-latest' && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows
          path: target/release/*.exe
          archive: false
          if-no-files-found: error
      - name: Signed by SignPath (Windows)
        if: matrix.os == 'windows-latest' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lumen-ide' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # The approval is by hand: an hour to give it.
          wait-for-completion-timeout-in-seconds: 3600
          skip-decompress: true
          output-artifact-directory: signed
      # The zip and the installer made from the program (the signed one when it was):
      # both offered, the zip as it was, the installer for the Start menu and Settings ›
      # Apps (Inno Setup, installed here if the machine hasn't it).
      - name: The zip and the installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Recurse -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            $sig = Get-AuthenticodeSignature $exe.FullName
            Write-Host "signed: $($sig.Status) by $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') { throw "the signature isn't valid: $($sig.StatusMessage)" }
            $exe = $exe.FullName
          } else {
            $exe = (Get-ChildItem target/release -Filter *.exe | Select-Object -First 1).FullName
          }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
          ./scripts/build.ps1 -Installer -Program $exe
      - name: The installer to sign (Windows)
        id: unsigned-setup
        if: matrix.os == 'windows-latest' && env.HAS_SIGNPATH == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-windows-setup
          path: dist/*-setup.exe
          archive: false
          if-no-files-found: error
      - name: The installer signed by SignPath (Windows)
        if: matrix.os == 'windows-latest' && env.HAS_SIGNPATH == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'lumen-ide' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_INSTALLER_CONFIGURATION_SLUG || 'installer' }}
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          skip-decompress: true
          output-artifact-directory: signed-setup
      - name: The signed installer in its place (Windows)
        if: matrix.os == 'windows-latest' && env.HAS_SIGNPATH == 'true'
        shell: pwsh
        run: |
          $setup = Get-ChildItem signed-setup -Recurse -Filter *-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "SignPath gave no installer back" }
          $sig = Get-AuthenticodeSignature $setup.FullName
          Write-Host "signed: $($sig.Status) by $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "the signature isn't valid: $($sig.StatusMessage)" }
          Copy-Item $setup.FullName dist/ -Force
      - name: Build (Linux)
        if: matrix.platform == 'Linux'
        run: ./scripts/build.sh linux --full
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*-setup.exe
          if-no-files-found: error

  publish:
    name: Draft release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: xtask
          save-if: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true
      - name: Checksums and the signed manifest
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: cargo xtask release-manifest --signed
      - name: The notes, from the commits since the last release
        run: |
          previous="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          # Between the two comments: what the app shows as "What's New" (the page shows it
          # too; the download section is the page's only).
          {
            echo "<!-- app -->"
            echo "## What's new"
            echo
            if [[ -n "$previous" ]]; then
              git log --no-merges --format='- %s' "$previous..HEAD"
            else
              echo "The first release."
            fi
            echo "<!-- /app -->"
            echo
            echo "## Download"
            echo
            echo "- **macOS** (Apple Silicon): \`*-macos-arm64.zip\`"
            echo "- **Windows** (x64): \`*-windows-x64-setup.exe\` (an installer), or \`*-windows-x64.zip\` (the program alone)"
            echo "- **Linux** (x86_64): \`*-linux-x86_64.tar.gz\`"
            echo
            echo "The builds aren't signed yet: macOS and Windows warn the first time they're"
            echo "opened (see the README's *Installing*)."
          } > notes.md
          cat notes.md
      # What the draft is made of, kept with the run: a draft that can't be made (a token
      # refused) is finished by hand from it, nothing built or signed again.
      - uses: actions/upload-artifact@v7
        with:
          name: release
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/latest.json
            dist/latest.json.sig
            notes.md
          if-no-files-found: error
      - name: The draft
        env:
          # A token of the repository's own (RELEASE_TOKEN, with Contents: write) when the
          # organization keeps the workflows' token from making releases.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          name="$(sed -n 's/^name *= *"\(.*\)"/\1/p' brand.toml | head -1)"
          tag="v$VERSION"
          files=(dist/*.zip dist/*.tar.gz dist/*-setup.exe dist/SHA256SUMS dist/latest.json dist/latest.json.sig)
          # Drafts of this version made before (a run again): replaced only once the new one
          # exists — a step failing leaves them as they were. A published release is never
          # touched.
          older="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id")"
          pre=""
          [[ "$VERSION" == *-* ]] && pre="--prerelease"
          gh release create "$tag" --draft $pre --target "$GITHUB_SHA" \
            --title "$name $VERSION" --notes-file notes.md "${files[@]}"
          for id in $older; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
