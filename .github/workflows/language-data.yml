name: Language data

# Regenerates Lumen's own language data every month: the PHP stubs (new PHP releases are
# found on Docker Hub, added to docker/php/compose.yaml, and the data is rebuilt from them)
# the CSS / HTML / JavaScript data (from MDN's public-domain data) and SQLite's functions
# (from the SQLite bundled with rusqlite, when its version changes).
# A pull request is opened when anything changed.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  stubs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@v2
      - name: PHP stubs
        run: cargo xtask php-stubs --update
      - name: CSS / HTML / JavaScript data
        run: cargo xtask web-data
      - name: SQLite functions
        run: cargo xtask sql-data
      - name: Pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: language-data
          title: "Language data update"
          commit-message: "Language data update"
          body: "Generated by `cargo xtask php-stubs --update`, `cargo xtask web-data` and `cargo xtask sql-data`."
