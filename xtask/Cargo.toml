[package]
name = "xtask"
description = "Development tools: `cargo xtask check-deps` (DDD rules), stubs, SQL and web data generation, the app icon, the bundled language servers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
kernel.workspace = true
serde_json.workspace = true
# `icon`: the app icon at every size, from its raster master.
image = { version = "0.25", default-features = false, features = ["png"] }
# `sql-data`: SQLite's functions, from the very SQLite the app bundles.
rusqlite.workspace = true
# `lsp-bundle`: the manifest, and the downloads' checksums.
toml.workspace = true
sha2 = "0.10"
# A native server released as one gzipped program (taplo).
flate2 = "1"
# `release-key` / `release-manifest`: the release's manifest signed (plan 84b).
ed25519-dalek = "3"
getrandom = "0.3"

[lints]
workspace = true
