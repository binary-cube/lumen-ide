# External dependencies (versions pinned here, used with `.workspace = true`)
serde_json = "1"
# Ed25519 (the release's signatures) and SHA-256 / SHA-512 (the downloads' sums): the app's
# checks and the release tools' signing, from one library.
ring = "0.17"
# xz, in Rust only (no C library to build for Windows): the app unpacks the downloads with
# it, the release tools pack the web engine's packages; each user adds the features it needs
# (`encoder`, `optimization`).
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
# A file's symbols kept compressed (the index's blocks, plan 74): deflate, pure Rust.
miniz_oxide = "0.8"
thiserror = "2"
tracing = "0.1"
# Identities that never repeat (a bottom window's views).
# Local sockets (named pipes on Windows, Unix sockets elsewhere): one running instance.
interprocess = "2.4"
postcard = { version = "1", default-features = false, features = ["use-std"] }
uuid = { version = "1", features = ["v4"] }
# The local time of day (a query console's Output stamps its lines with it); already in the
# tree through other crates, only its clock asked for.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Passwords wiped from memory once dropped (`kernel::Secret`).
zeroize = "1.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
winit = "0.30"
# The accessibility tree handed to the system's screen readers (UI Automation, NSAccessibility,
# AT-SPI), from the winit window.
accesskit = "0.25"
accesskit_winit = "0.34"
pollster = "1"
cosmic-text = "0.19"
memmap2 = "0.9"
etagere = "0.3"
tiny-skia = "0.12"
png = "0.18"
anyhow = "1"
rfd = "0.17"
muda = "0.21"
ropey = "1.6"
unicode-segmentation = "1"
regex = "1"
arboard = { version = "3", default-features = false }
proptest = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
dirs = "7"
tree-sitter = "0.27"
resvg = { version = "0.48", default-features = false }
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false, features = ["extended"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tree-sitter-php = "0.25"
tree-sitter-html = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-css = "0.25"
# Vendored: the published build gives MSVC a GCC flag it refuses (see its build.rs).
tree-sitter-scss = { path = "third_party/tree-sitter-scss" }
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-zig = "1.1"
tree-sitter-bash = "0.25"
tree-sitter-toml-ng = "0.7"
tree-sitter-md = "0.5.4"
tree-sitter-containerfile = "0.9"
tree-sitter-twig = { path = "third_party/tree-sitter-twig" }
tree-sitter-blade = { path = "third_party/tree-sitter-blade" }
tree-sitter-sql = { path = "third_party/tree-sitter-sql" }
tree-sitter-dotenv = { path = "third_party/tree-sitter-dotenv" }
tree-sitter-http = { path = "third_party/tree-sitter-http" }
alacritty_terminal = "0.26"
notify = "8"
# SQLite, compiled in (`bundled`: nothing to install, the same version everywhere).
rusqlite = { version = "0.41", default-features = false, features = ["bundled", "hooks", "column_decltype"] }

[workspace.lints.rust]
unsafe_code = "deny"            # drivers may allow it locally, with a // SAFETY: comment
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "warn"
todo = "warn"
# A clone whose original isn't used after it: an allocation and a copy for nothing.
redundant_clone = "warn"

[profile.release]
opt-level = 3        # Maximum optimization
lto = "fat"          # Whole-program optimization: 10% smaller binary (84.4 → 75.9 MB), slower build
codegen-units = 1    # Allows deeper optimization passes; also the faster release build
# (measured on GitHub's Linux runner: the app's crates and fat LTO in ~7 min with 1, ~13
# with 16). Changing a release setting: bump `profile-v…` in release.yml and
# release-cache.yml (a cache's key never takes new content).
# Unwinding (the default): a panic is caught where it can be (a window, a parser, a
# module), so it never takes the whole app — and every unsaved file — with it.


# The local builds (`scripts/build.sh`; `--full` for `release`): as `release`, but the
# whole-program optimization thin and the code optimized in parallel (fat LTO with one
# codegen unit runs its last step on a single core). What's handed out stays `release`.
[profile.dist-fast]
inherits = "release"
lto = "thin"
codegen-units = 16

[profile.dev]
# File:line in backtraces is enough: full debug info makes every test binary several times
# larger and slower to link (65 of them on a `cargo test --workspace`).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2                    # dependencies optimized: rendering stays smooth in debug
debug = false

# The project's own tasks (the app icon rendered at every size, data converted): optimized,
# as their dependencies are (measured: the icon in 1.4 s instead of 6.8 s).
[profile.dev.package.xtask]
opt-level = 2

# The parser runs on every keystroke and over whole projects in the tests.
[profile.dev.package.tree-sitter]
opt-level = 3
