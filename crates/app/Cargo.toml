# `build.rs`: the icon and the version information inside the Windows executable.
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
lsp-client = { workspace = true, features = ["fake"] }
# The engines' comparison's probes and answers (`tools/lsp-compare`).
serde_json.workspace = true
# A GPU without a window: a page of the app's engine drawn in a test.
render-wgpu = { workspace = true, features = ["offscreen"] }

[features]
# `--snapshot`: the screens rendered into PNGs (visual checks, `scripts/ui-snapshots.sh`);
# not in the builds handed out.
snapshot = ["agent-chat/snapshot", "database-explorer/snapshot", "remote-projects/snapshot", "database-console/snapshot", "services-panel/snapshot", "task-manager/snapshot", "keep-awake/snapshot", "terminal-panel/snapshot", "relax/snapshot", "dep:lsp-client", "lsp-client/fake", "render-wgpu/offscreen"]
# The system's allocator on Windows too, instead of mimalloc (to compare them).
system-allocator = []

# mimalloc on Windows only (see `main.rs`).
[target.'cfg(windows)'.dependencies]
mimalloc.workspace = true
libmimalloc-sys.workspace = true

[lints]
workspace = true
