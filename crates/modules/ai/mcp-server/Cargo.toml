[package]
name = "mcp-server"
description = "The editor's MCP server: agents on the machine use the editor (files opened, the selection, the open tabs, an open file's text) through tools the modules offer; off until turned on."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
agents.workspace = true
mcp.workspace = true
mcp-transport.workspace = true
extensions.workspace = true
i18n.workspace = true
process.workspace = true
secrets.workspace = true
serde_json.workspace = true
settings-model.workspace = true
tracing.workspace = true
workbench-model.workspace = true

[lints]
workspace = true
