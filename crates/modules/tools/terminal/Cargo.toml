[package]
name = "terminal-panel"
description = "The terminal panel: tabs, the grid rendered on the GPU, the ANSI palette from the theme, its settings."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
theming.workspace = true
kernel.workspace = true
terminal-session.workspace = true
pty.workspace = true
# The shells noted for the next start (`process::launched`).
process.workspace = true
icons.workspace = true
text-layout.workspace = true
render-api.workspace = true
ui-kit.workspace = true
ui-components.workspace = true
tracing.workspace = true
i18n.workspace = true
extensions.workspace = true
command-model.workspace = true
workbench-model.workspace = true
settings-model.workspace = true
agents.workspace = true
contracts.workspace = true
# Writes kept private and whole (the histories spilled to disk).
files.workspace = true
# The histories spilled to disk sealed with the run's key.
secrets.workspace = true
# The histories spilled to disk compressed first.
miniz_oxide.workspace = true
# What each program run by a module holds (its process tree), measured on a thread.
process-stats.workspace = true

[dev-dependencies]
# A test host's repository (none).
version-control.workspace = true

[features]
# The app's `--snapshot`: a session's tab put to sleep by hand (`snapshot:asleep`).
snapshot = []

[lints]
workspace = true
