[package]
name = "relax"
description = "Relax mode: a calm animated scene over the whole window (stars, a sea of light, a ribbon of light), its button above the Task Manager's, Esc to leave; optionally started after a while without input."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
contracts.workspace = true
kernel.workspace = true
i18n.workspace = true
extensions.workspace = true
command-model.workspace = true
workbench-model.workspace = true
ui-kit.workspace = true
ui-components.workspace = true
render-api.workspace = true
text-layout.workspace = true
languages.workspace = true
settings-model.workspace = true
tracing.workspace = true
# The clock's hours and minutes, in the user's time zone.
chrono.workspace = true

[dev-dependencies]
# One picture per scene, to look at (`EDITOR_RELAX_SHOTS=<dir>`).
render-software.workspace = true
icons.workspace = true

[features]
# The app's `--snapshot`: the scene as after its fade, its widgets in (`snapshot:settled`).
snapshot = []

[lints]
workspace = true
