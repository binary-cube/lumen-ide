[package]
name = "services-panel"
description = "The Services window at the bottom: what the modules have running (a data source's consoles and their results), as a tree whose nodes' tabs are their views (the Output log, a result). Generic: it never knows who contributes (they register a ServiceProvider); nothing of theirs runs before it's first shown."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
i18n.workspace = true
extensions.workspace = true
command-model.workspace = true
workbench-model.workspace = true
ui-kit.workspace = true
ui-components.workspace = true
render-api.workspace = true
text-layout.workspace = true
icons.workspace = true

[lints]
workspace = true

[features]
# The app's `--snapshot`: a sample contributor (`sample`), its nodes and tabs made up.
snapshot = []
