[package]
name = "keep-awake"
description = "Keep awake: the computer doesn't go to sleep while it's on (an AI working in a terminal, transfers, a long indexing) — its button above Focus mode's, its settings on its own page; the system's hold taken once for the whole app and let go when it's off or the app ends."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
contracts.workspace = true
kernel.workspace = true
i18n.workspace = true
extensions.workspace = true
command-model.workspace = true
workbench-model.workspace = true
ui-components.workspace = true
ui-kit.workspace = true
render-api.workspace = true
text-layout.workspace = true
languages.workspace = true
settings-model.workspace = true
power.workspace = true
power-system.workspace = true
tracing.workspace = true

[features]
# The app's `--snapshot`: the dimmed screen as after its fade (`snapshot:dimmed`).
snapshot = []

[lints]
workspace = true
