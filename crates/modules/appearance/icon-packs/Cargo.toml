[package]
name = "icon-packs"
description = "Icon packs with other drawings for the interface (Lucide, Tabler, Phosphor, Material Symbols, Remix Icon, Heroicons, Fluent, Iconoir, Bootstrap Icons, Octicons, Ionicons) and file icon sets (Material, Catppuccin, Symbols, vscode-icons), each a module, read only once chosen."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
extensions.workspace = true
icons.workspace = true

[dev-dependencies]
render-api.workspace = true

[lints]
workspace = true
