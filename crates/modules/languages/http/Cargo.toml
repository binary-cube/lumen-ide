[package]
name = "lang-http"
description = "The .http module: HTTP request files (`.http`, `.rest`, the syntax shared by HTTP clients), their grammar (vendored rest-nvim tree-sitter-http), colors (a request's body in its own language, its scripts in JavaScript), folding per request."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
extensions.workspace = true
languages.workspace = true
syntax-ts.workspace = true
tree-sitter-http.workspace = true
code-intelligence.workspace = true
http-requests.workspace = true
http-environments.workspace = true
kernel.workspace = true
i18n.workspace = true
workbench-model.workspace = true

[lints]
workspace = true

[dev-dependencies]
document.workspace = true
