[package]
name = "lang-markdown"
description = "The Markdown module: language, grammars (blocks and inline text), colors, folding by section, code blocks in their own language, headings as its structure."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
code-intelligence.workspace = true
extensions.workspace = true
languages.workspace = true
syntax-ts.workspace = true
tree-sitter-md.workspace = true

[lints]
workspace = true

[dev-dependencies]
document.workspace = true
