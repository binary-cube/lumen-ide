[package]
name = "lang-sql"
description = "The SQL module: language, grammar (vendored DerekStride tree-sitter-sql), highlighting, folding, `$$` bodies as SQL, keywords and functions per dialect, and \"Reformat Code\" by the domain's formatter (a statement or the file, by the document's dialect, with its settings)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
extensions.workspace = true
languages.workspace = true
syntax-ts.workspace = true
code-intelligence.workspace = true
workbench-model.workspace = true
tree-sitter-sql.workspace = true
database.workspace = true
code-quality.workspace = true
command-model.workspace = true
settings-model.workspace = true
i18n.workspace = true
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
document.workspace = true
