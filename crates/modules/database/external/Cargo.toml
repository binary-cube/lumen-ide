[package]
name = "database-external"
description = "Drivers installed apart, as a module: the drivers' manifests (`drivers/<name>/driver.toml` in the config folder) read the first time a driver is asked for, each one listed among the drivers (marked external), its files and its value editors known — its program started only when a session of it opens, through the drivers' protocol (`db-protocol`)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
database.workspace = true
db-protocol.workspace = true
extensions.workspace = true
storage.workspace = true
tracing.workspace = true
ui-components.workspace = true

[lints]
workspace = true
