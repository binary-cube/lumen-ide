[package]
name = "database-sqlite"
description = "The SQLite driver, as a module: its factory for the data sources, and SQLite files (.sqlite, .sqlite3, .db, .db3) recognized by their header, only their first bytes read. Nothing of SQLite runs until a source opens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
database.workspace = true
db-sqlite.workspace = true
document.workspace = true
extensions.workspace = true
fs-local.workspace = true

[lints]
workspace = true
