[package]
name = "database-diagram"
description = "The relations diagram of a data source, as a module: its tables as cards (their columns, keys and types) and the links between them from their foreign keys, with the columns joining them and their cardinality; laid out once per structure in the background, narrowed to a table's neighbors or by name, panned and zoomed. Opened by the explorer through the domain's port, never depending on it."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
database.workspace = true
kernel.workspace = true
extensions.workspace = true
command-model.workspace = true
workbench-model.workspace = true
languages.workspace = true
i18n.workspace = true
ui-components.workspace = true
ui-kit.workspace = true
text-layout.workspace = true
render-api.workspace = true
icons.workspace = true

[lints]
workspace = true
