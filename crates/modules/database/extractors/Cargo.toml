[package]
name = "data-extractors"
description = "Data extractors, as a module: the choice a grid's toolbar makes kept per project (its own project.toml), \"Skip Computed / Skip Generated Columns\" and the separated formats (CSV, TSV, pipes, semicolons, the user's own: separator, quote, header, NULL's text, line ending) kept in the settings and edited in \"Configure CSV Formats…\", handed to the catalog every grid copies and exports through; the user's own extractors — *.extractor templates in the project's own folder and the config folder, read in the background and again when they change, their errors shown where they are, a few examples made by \"Go to Extractors Directory\" — and their files as a language (colored by the Twig grammar, completed)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
extractors.workspace = true
kernel.workspace = true
extensions.workspace = true
workbench-model.workspace = true
settings-model.workspace = true
command-model.workspace = true
i18n.workspace = true
tracing.workspace = true
ui-components.workspace = true
ui-kit.workspace = true
render-api.workspace = true
text-layout.workspace = true
icons.workspace = true
# The templates' folders: the project's events (its watcher hears it), the config folder's
# own watcher and its place.
workspace.workspace = true
fs-local.workspace = true
storage.workspace = true
# `*.extractor` files as a language: colored by the Twig grammar (its `{{ }}` tags),
# completed by the template's own suggestions.
languages.workspace = true
syntax-ts.workspace = true
tree-sitter-twig.workspace = true
code-intelligence.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The tests' host answers for the repository it has none of.
version-control.workspace = true
