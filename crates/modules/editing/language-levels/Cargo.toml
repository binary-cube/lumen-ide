[package]
name = "language-levels"
description = "The language version picker (e.g. PHP 8.3): a popover above the status bar item, choosing the version for the project or only for the active file."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
extensions.workspace = true
ui-components.workspace = true

[dev-dependencies]
icons.workspace = true
text-layout.workspace = true
render-api.workspace = true

[lints]
workspace = true
