[package]
name = "viewer-markdown"
description = "The Markdown preview: rendered on the GPU, next to the source (Editor / Split / Preview)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
workbench-model.workspace = true
kernel.workspace = true
extensions.workspace = true
image-decode.workspace = true
render-api.workspace = true
text-layout.workspace = true
ui-kit.workspace = true
ui-components.workspace = true
i18n.workspace = true
command-model.workspace = true
diagram-text.workspace = true
tex.workspace = true
web-fetch.workspace = true
files.workspace = true
settings-model.workspace = true
tracing.workspace = true
# The math font comes compressed (xz): decompressed once, with the first formula.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "xz"] }
# BSD-3-Clause: a diagram's shapes rasterized (already the software renderer's).
tiny-skia.workspace = true
# The shapes' outlines and their tiles (shared with the diagram editor).
vector-tiles.workspace = true
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
icons.workspace = true

[lints]
workspace = true
