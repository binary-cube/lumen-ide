[package]
name = "local-history"
description = "Local history: a version of every file kept on each save (and the one on disk before it), listed per file, compared with the current text and brought back — no git needed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
extensions.workspace = true
command-model.workspace = true
workbench-model.workspace = true
document.workspace = true
version-control.workspace = true
i18n.workspace = true
ui-components.workspace = true
ui-kit.workspace = true
text-layout.workspace = true
render-api.workspace = true
history.workspace = true
history-fs.workspace = true
settings-model.workspace = true
tracing.workspace = true

[dev-dependencies]
icons.workspace = true

[lints]
workspace = true
