[package]
name = "ui-components"
description = "What modules build their views with, kept apart from the workbench's own screens (so changing those recompiles only the app): the Viewer contract, the design system (ds), the palette, splitters, tooltips, side panels, the color picker, code drawing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
ui-kit.workspace = true
render-api.workspace = true
text-layout.workspace = true
icons.workspace = true
theming.workspace = true
diff.workspace = true
refactor.workspace = true
code-intelligence.workspace = true
i18n.workspace = true
workbench-model.workspace = true
command-model.workspace = true
# What copied and exported rows become (the data extractors).
extractors.workspace = true
# An export as an Excel workbook (XLSX: a zip of XML parts, deflated); already in the tree
# through the local history.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
