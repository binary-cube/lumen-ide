[package]
name = "platform-winit"
description = "The platform implementation over winit."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
platform-api.workspace = true
winit.workspace = true
accesskit.workspace = true
accesskit_winit.workspace = true
raw-window-handle.workspace = true
tracing.workspace = true
rfd.workspace = true
# A message for an app's page written as a script's string literal (`web_app`).
serde_json.workspace = true
# `image-data`: a diagram copied as a picture.
arboard = { workspace = true, features = ["image-data"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
muda.workspace = true
# A response's page shown by the system's web engine (WKWebView, WebView2), only while it's
# open (plan 77h). Not on Linux: there a page opens in the browser.
wry = { version = "=0.57.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSResponder", "NSView", "NSWindow", "NSControl", "NSButton", "NSColor", "NSColorSampler", "NSColorSpace", "NSApplication", "NSWorkspace", "NSAccessibility", "NSMenu", "NSImage", "NSImageView", "NSStatusBar", "NSStatusItem", "NSStatusBarButton", "NSDockTile", "NSBitmapImageRep", "NSImageRep", "NSGraphics", "NSCell", "NSTextInputContext", "objc2-core-foundation"] }
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSGeometry", "NSProcessInfo", "NSNotification", "NSOperation", "NSString", "NSData"] }

# Linux: the app icon's PNG, decoded for the windows (`app_icon.rs`).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
png = "0.18"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage", "Win32_UI_WindowsAndMessaging"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_SystemInformation", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
