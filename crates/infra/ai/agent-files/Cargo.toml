[package]
name = "agent-files"
description = "What every agent's module reads on disk alike: its program found where installers put it, its sessions' files listed with limits (no links followed) and kept by their stamps, bounded reads."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
dirs.workspace = true

[dev-dependencies]
uuid.workspace = true

[lints]
workspace = true
