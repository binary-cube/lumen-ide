[package]
name = "remote-ftp"
description = "FTP and FTPS (explicit / implicit TLS, rustls) for remote projects: the `remote` domain's RemoteFs / Connector ports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
remote.workspace = true
suppaftp = { version = "12", default-features = false, features = ["rustls-ring", "deprecated"] }
webpki-roots = "1"
ring = "0.17"

[lints]
workspace = true
