[package]
name = "git"
description = "The git adapter: reading with gitoxide (pure Rust, no git installed needed), status and commits with the installed git."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
process.workspace = true
files.workspace = true
kernel.workspace = true
version-control.workspace = true
gix = { version = "0.89", default-features = false, features = ["sha1", "max-performance-safe", "revision", "index", "blame"] }
tracing.workspace = true

[lints]
workspace = true
