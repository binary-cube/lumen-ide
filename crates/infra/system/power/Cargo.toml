[package]
name = "power-system"
description = "The system's own way to keep the computer awake (the `power` port): an IOKit assertion on macOS, a power request on Windows, a systemd inhibitor on Linux — each let go when its hold is dropped, and by the system when the process ends."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
power.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Power", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
