[package]
name = "web-host-core"
description = "The web engine's process (web-host) apart from the engine: its one channel shared by every app, its clients, their pages, when it ends."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
interprocess.workspace = true
tracing.workspace = true
web-engine-protocol.workspace = true

[dev-dependencies]
# Each test's channel in a folder of its own.
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
# The host's own user, and on macOS a peer's process (`peer.rs`).
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The pipe's access in Windows' security descriptor text (its owner only).
widestring = "1"
# A client's pipe disconnected from the host's side (`peer.rs`).
windows-sys = { version = "0.59", features = ["Win32_System_Pipes"] }

[lints]
workspace = true
