[package]
name = "process-stats"
description = "What this process's threads cost (each thread's name and the CPU time it used) and what the programs it started cost (macOS, Linux, Windows), for attributing CPU, memory and disk to the parts of the app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
sysinfo.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[lints]
workspace = true
