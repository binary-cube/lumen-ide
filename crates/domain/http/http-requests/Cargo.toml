[package]
name = "http-requests"
description = "HTTP requests as the user writes them: `.http` files (the common `.http` syntax) read into requests, their environments (public, private, local), variables resolved, cURL in and out. No network, no UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
kernel.workspace = true
serde_json.workspace = true
# Pure hashes (Digest authentication, the scripts' `crypto`, PKCE), XML read for XPath.
sha1 = "0.11"
sha2 = "0.11"
sha3 = "0.12"
md-5 = "0.11"
hmac = "0.13"
roxmltree = "0.21"
yaml-rust2 = { version = "=0.13.0", default-features = false }

[lints]
workspace = true
