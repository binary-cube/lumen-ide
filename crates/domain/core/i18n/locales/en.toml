[profile.severity]
info = "Info"
warning = "Warning"
critical = "Critical"

[profile.finding.hot-spot]
title = "Where the time goes"
why = "{step} takes {share} of the statement's time on its own ({time})."
fix = "Start here: the other findings say what could make it faster."
why_cost = "{step} has {share} of the plan's cost on its own ({cost}): an estimate, nothing ran."
fix_cost = "Run Explain Analyze to see where the time really goes."

[profile.finding.seq-scan-selective]
title = "A full scan keeps few rows"
why = "{step} read {read} rows to keep {kept} ({kept_share})."
fix = "An index on what the filter compares would read only those rows."
why_index_function = "{step} read {read} rows to keep {kept}: the index {index} on {column} exists, but the condition wraps the column in {function}()."
fix_index_function = "Compare the column itself, or index the expression."
why_index_cast = "{step} read {read} rows to keep {kept}: the index {index} on {column} exists, but the condition converts the column to {type}."
fix_index_cast = "Compare it with a value of the column's own type."
why_index_statistics = "{step} read {read} rows to keep {kept}: the index {index} on {column} exists, but the planner misjudged how many rows it keeps."
fix_index_statistics = "Refresh the table's statistics (ANALYZE), then profile again."
why_index_selectivity = "{step} read {read} rows to keep {kept}: the index {index} on {column} exists, and the planner judged reading the whole table cheaper."
fix_index_selectivity = "If the rows kept are really few, check the statistics; otherwise the scan may be right."

[profile.finding.misestimate]
title = "The planner's estimate was far off"
why = "{step} expected {estimated} rows and got {actual} ({factor})."
fix = "The planner's other choices rest on that number: refresh the statistics (ANALYZE), or add extended statistics for columns that depend on each other."
why_join = "{step} expected {estimated} rows and got {actual} ({factor}), and it feeds {target}: the join was chosen for the wrong count."
fix_join = "Refresh the statistics (ANALYZE), or add extended statistics for columns that depend on each other: with a right estimate the planner may join differently."

[profile.finding.nested-loop-many]
title = "A nested loop repeats its inner side many times"
why = "{step} ran {loops} times, {share} of the time."
fix = "An index on the column it's joined by makes each loop a quick lookup."
why_outer_misestimate = "{step} ran {loops} times: the outer side brought far more rows than the planner expected ({factor})."
fix_outer_misestimate = "With a right estimate the planner would pick another join: refresh the outer table's statistics."

[profile.finding.spill-to-disk]
title = "Work went to disk"
why = "{step} didn't fit in memory and used the disk ({spill})."
fix = "A larger work_mem for this session keeps it in memory; it's taken by each such step and each parallel worker, so raise it with care."

[profile.finding.filter-removes-most]
title = "The filter throws most rows away"
why = "{step} read {read} rows and its filter removed {removed} ({removed_share})."
fix = "An index covering the filter's columns too reads only the rows kept."

[profile.finding.fk-join-no-index]
title = "A foreign key without an index"
why = "The join on {table}({columns}) → {target} reads {table} whole: no index starts with the key's columns."
fix = "Index the foreign key's columns: joins, and deletes of the rows it points to, stop reading the whole table."
why_virtual = "The join on {table}({columns}) → {target} (a virtual key you accepted) reads {table} whole: no index starts with its columns."
fix_virtual = "Index the key's columns: joins stop reading the whole table."

[profile.finding.sqlite-scan]
title = "SQLite reads a whole table"
why = "{step} reads every row of {table} to find those the WHERE asks for."
fix = "An index on the compared columns lets SQLite search instead of scanning."
why_loop = "{step} reads every row of {table} again for each row of the loop around it."
fix_loop = "An index on the column it's joined by makes each loop a search."

[profile.finding.sqlite-temp-btree]
title = "SQLite sorts in a temporary B-tree"
why = "SQLite puts about {read} rows in a temporary B-tree for {purpose} before returning the first."
fix = "An index in that order gives the rows already sorted."

[profile.finding.auto-index]
title = "SQLite builds an index for each run"
why = "{step}: SQLite builds an index for this statement alone, then drops it."
fix = "Make the same index for good: each run stops building it."
why_counter = "SQLite built automatic indexes for this statement ({read} rows put in them)."
fix_counter = "Make the index for good on the columns it joins by: each run stops building it."

[profile.finding.function-on-column]
title = "A function hides an indexed column"
why = "The condition wraps {column} in {function}(): the index {index} can't be used for it."
fix = "Compare the column itself, or index the expression."

[profile.finding.implicit-cast]
title = "A conversion hides an indexed column"
why = "The condition converts {column} ({value}) to {type}: the index {index} can't be used for it."
fix = "Compare it with a value of the column's own type."

[profile.finding.or-defeats-index]
title = "An OR between columns reads the whole table"
why = "{step} reads all of {table}: the filter's OR compares {columns}, each with its own index."
fix = "A UNION ALL of one query per branch lets each use its index."

[profile.finding.leading-wildcard]
title = "LIKE starting with %"
why = "A pattern starting with % can't use the index {index} on {column}."
fix = "For searches inside the text, a full-text search fits better."
why_trigram = "A pattern starting with % can't use the index {index} on {column}."
fix_trigram = "A trigram index (GIN, gin_trgm_ops) finds a pattern anywhere; it needs the pg_trgm extension (CREATE EXTENSION pg_trgm), which an administrator installs."

[profile.finding.select-star-wide]
title = "SELECT * of wide rows"
why = "Every column of wide rows is read, sent and kept, and no index can answer the query alone."
fix = "List only the columns used."

[profile.finding.limit-without-order]
title = "LIMIT without ORDER BY"
why = "Which rows come isn't defined: they may change from one run to the next."
fix = "Add an ORDER BY saying which rows you want."

[profile.finding.big-offset]
title = "A large OFFSET"
why = "The engine reads and throws away {offset} rows before the page."
fix = "Page by the last row's key (WHERE id > :last ORDER BY id LIMIT n): each page then costs the same."

[profile.finding.n-plus-one]
title = "The same query, over and over"
why = "This query ran {runs} times in the last {window}, each with other values."
fix = "One query for all the values (IN (…), or a JOIN) saves the round trips."
why_server = "The server ran it {calls} times, {mean} each on average."
fix_server = "One query for all the values (IN (…), or a JOIN) saves the round trips."

[profile.finding.workers-not-launched]
title = "Fewer parallel workers than planned"
why = "{step} planned {planned} workers and got {launched}: the server had none free."
fix = "Check max_parallel_workers and max_worker_processes, or how busy the server was."

[profile.finding.jit-dominates]
title = "JIT compilation takes much of the time"
why = "Compiling the query took {jit} of {execution} ({share})."
fix = "For this session, SET jit = off (or a higher jit_above_cost), then profile again."

[profile.finding.planning-dominates]
title = "Planning takes longer than running"
why = "Planning took {planning}, running it {execution}."
fix = "Fewer partitions or joins to weigh, or a prepared statement planned once, help."

[profile.finding.heap-fetches]
title = "An index-only scan still reads the table"
why = "{step} went to the table for {heap_fetches} of {actual} rows ({share}): its visibility map is behind."
fix = "VACUUM the table so the index alone can answer."

[profile.finding.lossy-bitmap]
title = "A lossy bitmap"
why = "{step}'s bitmap didn't fit in work_mem: {lossy} blocks kept whole, their rows checked again."
fix = "A larger work_mem for this session ({value})."

[profile.finding.dead-tuples]
title = "Many dead rows"
why = "{table} holds {dead} dead rows for {live} live ones ({dead_share})."
fix = "VACUUM the table (autovacuum may be behind)."

[profile.finding.stale-stats]
title = "Missing or old statistics"
why = "{table} was never analyzed: the planner guesses its rows."
fix = "ANALYZE the table, then profile again."
why_changed = "{modified} rows of {table} changed since its last ANALYZE ({modified_share})."
fix_changed = "ANALYZE the table, then profile again."
why_sqlite = "{table} has no statistics (sqlite_stat1): SQLite guesses how to join it."
fix_sqlite = "Run ANALYZE once (and again after big changes)."

[profile.finding.cold-cache]
title = "Read from disk"
why = "{blocks_read} of {blocks_touched} blocks ({read_share}) were read from disk, not found in memory."
fix = "Probably a first run: run it again to compare with a warm cache."
why_no_io_timing = "{blocks_read} of {blocks_touched} blocks ({read_share}) were read from disk; how long that took is unknown (track_io_timing is off)."
fix_no_io_timing = "Probably a first run: run it again to compare with a warm cache."

[profile.finding.disabled-node]
title = "A step the planner was told not to use"
why = "The planner was told not to use {step}, and still had to (or chose worse around it)."
fix = "Turn the setting that disabled it back on for this session."
why_setting = "{setting} is off for this session: the planner avoids that kind of step."
fix_setting = "SET {setting} = on, unless it was turned off on purpose."

[profile.finding.trigger-time]
title = "Triggers take much of the write"
why = "The triggers took {share} of {execution}; the slowest, {trigger}, {time}."
fix = "Check what {trigger} does for each row."

[profile.finding.no-statement-stats]
title = "No history of the query on the server"
why = "The server keeps no statistics of its queries (the pg_stat_statements extension isn't installed or loaded): what this query costs over time and how often it runs are unknown."
fix = "Installing it is the administrator's call: pg_stat_statements in shared_preload_libraries, a restart, then CREATE EXTENSION pg_stat_statements. Nothing is installed from here."

