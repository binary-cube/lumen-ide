info = "Informare"
warning = "Avertisment"
critical = "Critic"

[profile.finding.hot-spot]
title = "Unde se duce timpul"
why = "{step} ia singur {share} din timpul instrucțiunii ({time})."
fix = "Începe de aici: celelalte constatări spun ce l-ar putea face mai rapid."
why_cost = "{step} are singur {share} din costul planului ({cost}): o estimare, nu s-a rulat nimic."
fix_cost = "Rulează Explain Analyze ca să vezi unde se duce cu adevărat timpul."

[profile.finding.seq-scan-selective]
title = "O parcurgere completă păstrează puține rânduri"
why = "{step} a citit {read} rânduri ca să păstreze {kept} ({kept_share})."
fix = "Un index pe ce compară filtrul ar citi doar acele rânduri."
why_index_function = "{step} a citit {read} rânduri ca să păstreze {kept}: indexul {index} pe {column} există, dar condiția învelește coloana în {function}()."
fix_index_function = "Compară coloana însăși sau indexează expresia."
why_index_cast = "{step} a citit {read} rânduri ca să păstreze {kept}: indexul {index} pe {column} există, dar condiția convertește coloana la {type}."
fix_index_cast = "Compar-o cu o valoare de tipul coloanei."
why_index_statistics = "{step} a citit {read} rânduri ca să păstreze {kept}: indexul {index} pe {column} există, dar planificatorul a greșit câte rânduri păstrează."
fix_index_statistics = "Reîmprospătează statisticile tabelului (ANALYZE), apoi profilează din nou."
why_index_selectivity = "{step} a citit {read} rânduri ca să păstreze {kept}: indexul {index} pe {column} există, iar planificatorul a socotit citirea întregului tabel mai ieftină."
fix_index_selectivity = "Dacă rândurile păstrate sunt chiar puține, verifică statisticile; altfel parcurgerea poate fi cea potrivită."

[profile.finding.misestimate]
title = "Estimarea planificatorului a fost departe de realitate"
why = "{step} aștepta {estimated} rânduri și a primit {actual} ({factor})."
fix = "Celelalte alegeri ale planificatorului se sprijină pe acest număr: reîmprospătează statisticile (ANALYZE) sau adaugă statistici extinse pentru coloanele care depind una de alta."
why_join = "{step} aștepta {estimated} rânduri și a primit {actual} ({factor}), iar rezultatul lui intră în {target}: joinul a fost ales pentru un număr greșit."
fix_join = "Reîmprospătează statisticile (ANALYZE) sau adaugă statistici extinse pentru coloanele care depind una de alta: cu o estimare corectă, planificatorul poate face altfel joinul."

[profile.finding.nested-loop-many]
title = "O buclă imbricată își repetă latura interioară de multe ori"
why = "{step} a rulat de {loops} ori, {share} din timp."
fix = "Un index pe coloana după care se face joinul transformă fiecare buclă într-o căutare rapidă."
why_outer_misestimate = "{step} a rulat de {loops} ori: latura exterioară a adus mult mai multe rânduri decât se aștepta planificatorul ({factor})."
fix_outer_misestimate = "Cu o estimare corectă, planificatorul ar alege alt join: reîmprospătează statisticile tabelului exterior."

[profile.finding.spill-to-disk]
title = "Lucrul a ajuns pe disc"
why = "{step} nu a încăput în memorie și a folosit discul ({spill})."
fix = "Un work_mem mai mare pentru această sesiune îl ține în memorie; îl ia fiecare astfel de pas și fiecare lucrător paralel, deci mărește-l cu grijă."

[profile.finding.filter-removes-most]
title = "Filtrul aruncă majoritatea rândurilor"
why = "{step} a citit {read} rânduri, iar filtrul lui a eliminat {removed} ({removed_share})."
fix = "Un index care acoperă și coloanele filtrului citește doar rândurile păstrate."

[profile.finding.fk-join-no-index]
title = "O cheie externă fără index"
why = "Joinul pe {table}({columns}) → {target} citește tot {table}: niciun index nu începe cu coloanele cheii."
fix = "Indexează coloanele cheii externe: joinurile și ștergerile rândurilor spre care arată nu mai citesc tot tabelul."
why_virtual = "Joinul pe {table}({columns}) → {target} (o cheie virtuală acceptată de tine) citește tot {table}: niciun index nu începe cu coloanele ei."
fix_virtual = "Indexează coloanele cheii: joinurile nu mai citesc tot tabelul."

[profile.finding.sqlite-scan]
title = "SQLite citește un tabel întreg"
why = "{step} citește fiecare rând din {table} ca să le găsească pe cele cerute de WHERE."
fix = "Un index pe coloanele comparate îi permite lui SQLite să caute în loc să parcurgă."
why_loop = "{step} citește din nou fiecare rând din {table} pentru fiecare rând al buclei din jurul lui."
fix_loop = "Un index pe coloana după care se face joinul transformă fiecare buclă într-o căutare."

[profile.finding.sqlite-temp-btree]
title = "SQLite sortează într-un B-tree temporar"
why = "SQLite pune aproximativ {read} rânduri într-un B-tree temporar pentru {purpose} înainte să-l dea pe primul."
fix = "Un index în această ordine dă rândurile deja sortate."

[profile.finding.auto-index]
title = "SQLite construiește un index la fiecare rulare"
why = "{step}: SQLite construiește un index doar pentru această instrucțiune, apoi îl aruncă."
fix = "Creează același index permanent: rulările nu-l mai construiesc de fiecare dată."
why_counter = "SQLite a construit indexuri automate pentru această instrucțiune ({read} rânduri puse în ele)."
fix_counter = "Creează indexul permanent pe coloanele după care se face joinul: rulările nu-l mai construiesc de fiecare dată."

[profile.finding.function-on-column]
title = "O funcție ascunde o coloană indexată"
why = "Condiția învelește {column} în {function}(): indexul {index} nu poate fi folosit pentru ea."
fix = "Compară coloana însăși sau indexează expresia."

[profile.finding.implicit-cast]
title = "O conversie ascunde o coloană indexată"
why = "Condiția convertește {column} ({value}) la {type}: indexul {index} nu poate fi folosit pentru ea."
fix = "Compar-o cu o valoare de tipul coloanei."

[profile.finding.or-defeats-index]
title = "Un OR între coloane citește tot tabelul"
why = "{step} citește tot {table}: OR-ul din filtru compară {columns}, fiecare cu indexul lui."
fix = "Un UNION ALL cu câte o interogare pe ramură îi permite fiecăreia să-și folosească indexul."

[profile.finding.leading-wildcard]
title = "LIKE care începe cu %"
why = "Un tipar care începe cu % nu poate folosi indexul {index} pe {column}."
fix = "Pentru căutări în interiorul textului se potrivește mai bine o căutare full-text."
why_trigram = "Un tipar care începe cu % nu poate folosi indexul {index} pe {column}."
fix_trigram = "Un index pe trigrame (GIN, gin_trgm_ops) găsește un tipar oriunde; cere extensia pg_trgm (CREATE EXTENSION pg_trgm), instalată de un administrator."

[profile.finding.select-star-wide]
title = "SELECT * pe rânduri late"
why = "Fiecare coloană a unor rânduri late e citită, trimisă și ținută, iar niciun index nu poate răspunde singur interogării."
fix = "Scrie doar coloanele folosite."

[profile.finding.limit-without-order]
title = "LIMIT fără ORDER BY"
why = "Nu e definit care rânduri vin: se pot schimba de la o rulare la alta."
fix = "Adaugă un ORDER BY care spune ce rânduri vrei."

[profile.finding.big-offset]
title = "Un OFFSET mare"
why = "Motorul citește și aruncă {offset} rânduri înaintea paginii."
fix = "Paginează după cheia ultimului rând (WHERE id > :last ORDER BY id LIMIT n): fiecare pagină costă la fel."

[profile.finding.n-plus-one]
title = "Aceeași interogare, iar și iar"
why = "Interogarea a rulat de {runs} ori în ultimele {window}, de fiecare dată cu alte valori."
fix = "O singură interogare pentru toate valorile (IN (…) sau un JOIN) scutește drumurile dus-întors."
why_server = "Serverul a rulat-o de {calls} ori, în medie {mean} fiecare."
fix_server = "O singură interogare pentru toate valorile (IN (…) sau un JOIN) scutește drumurile dus-întors."

[profile.finding.workers-not-launched]
title = "Mai puțini lucrători paraleli decât s-a planificat"
why = "{step} a planificat {planned} lucrători și a primit {launched}: serverul nu avea liberi."
fix = "Verifică max_parallel_workers și max_worker_processes sau cât de încărcat era serverul."

[profile.finding.jit-dominates]
title = "Compilarea JIT ia mult din timp"
why = "Compilarea interogării a durat {jit} din {execution} ({share})."
fix = "Pentru această sesiune, SET jit = off (sau un jit_above_cost mai mare), apoi profilează din nou."

[profile.finding.planning-dominates]
title = "Planificarea durează mai mult decât rularea"
why = "Planificarea a durat {planning}, rularea {execution}."
fix = "Ajută mai puține partiții sau joinuri de cântărit ori o instrucțiune pregătită, planificată o dată."

[profile.finding.heap-fetches]
title = "O parcurgere doar pe index citește totuși tabelul"
why = "{step} a mers la tabel pentru {heap_fetches} din {actual} rânduri ({share}): harta lui de vizibilitate a rămas în urmă."
fix = "Rulează VACUUM pe tabel, ca indexul să poată răspunde singur."

[profile.finding.lossy-bitmap]
title = "Un bitmap cu pierderi"
why = "Bitmap-ul lui {step} nu a încăput în work_mem: {lossy} blocuri ținute întregi, cu rândurile verificate din nou."
fix = "Un work_mem mai mare pentru această sesiune ({value})."

[profile.finding.dead-tuples]
title = "Multe rânduri moarte"
why = "{table} ține {dead} rânduri moarte la {live} vii ({dead_share})."
fix = "Rulează VACUUM pe tabel (autovacuum poate fi în urmă)."

[profile.finding.stale-stats]
title = "Statistici lipsă sau vechi"
why = "{table} nu a fost analizat niciodată: planificatorul îi ghicește rândurile."
fix = "Rulează ANALYZE pe tabel, apoi profilează din nou."
why_changed = "{modified} rânduri din {table} s-au schimbat de la ultimul ANALYZE ({modified_share})."
fix_changed = "Rulează ANALYZE pe tabel, apoi profilează din nou."
why_sqlite = "{table} nu are statistici (sqlite_stat1): SQLite ghicește cum să facă joinul."
fix_sqlite = "Rulează ANALYZE o dată (și din nou după schimbări mari)."

[profile.finding.cold-cache]
title = "Citit de pe disc"
why = "{blocks_read} din {blocks_touched} blocuri ({read_share}) au fost citite de pe disc, nu găsite în memorie."
fix = "Probabil o primă rulare: rulează din nou ca să compari cu memoria deja încălzită."
why_no_io_timing = "{blocks_read} din {blocks_touched} blocuri ({read_share}) au fost citite de pe disc; cât a durat nu se știe (track_io_timing e oprit)."
fix_no_io_timing = "Probabil o primă rulare: rulează din nou ca să compari cu memoria deja încălzită."

[profile.finding.disabled-node]
title = "Un pas pe care planificatorul fusese rugat să nu-l folosească"
why = "Planificatorului i s-a spus să nu folosească {step} și a trebuit totuși (sau a ales mai rău în jurul lui)."
fix = "Repornește pentru această sesiune setarea care l-a oprit."
why_setting = "{setting} e oprit pentru această sesiune: planificatorul evită acest fel de pas."
fix_setting = "SET {setting} = on, dacă nu a fost oprit intenționat."

[profile.finding.trigger-time]
title = "Triggerele iau mult din scriere"
why = "Triggerele au luat {share} din {execution}; cel mai lent, {trigger}, {time}."
fix = "Verifică ce face {trigger} pentru fiecare rând."

[profile.finding.no-statement-stats]
title = "Niciun istoric al interogării pe server"
why = "Serverul nu ține statistici ale interogărilor (extensia pg_stat_statements nu e instalată sau încărcată): cât costă interogarea în timp și cât de des rulează nu se știu."
fix = "Instalarea e decizia administratorului: pg_stat_statements în shared_preload_libraries, o repornire, apoi CREATE EXTENSION pg_stat_statements. De aici nu se instalează nimic."

