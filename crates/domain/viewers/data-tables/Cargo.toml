[package]
name = "data-tables"
description = "Tables found in any data: a document's format recognized (JSON, YAML, XML, HTML, CSV, TSV) and every table in it read (a list of records, repeated elements, an HTML table, delimited lines), its columns' kinds inferred — as charts read rows. No I/O."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
i18n.workspace = true
kernel.workspace = true
charts-model.workspace = true
serde_json.workspace = true
serde.workspace = true
roxmltree = "0.21"
yaml-rust2 = { version = "=0.13.0", default-features = false }

[lints]
workspace = true
