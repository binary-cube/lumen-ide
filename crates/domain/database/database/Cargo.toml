[package]
name = "database"
description = "Databases bounded context: the driver interface every engine implements (relational, documents, search, key-value), data sources, sessions (explorer tree, queries streamed as rows, tables read a page at a time, rows and structure changed in transactions), SQL dialects, the SQL a user writes read by pure rules (tokens and statements per dialect, their kinds, parameters, secrets and dangers) and laid out again (only whitespace and the keywords' case changed, checked by reading it again), the console's contract with every driver (statements run a page at a time with their rows streamed, cursors, plans as trees, a statement's profile normalized for every engine (versioned, a flat tree of typed figures with every engine-specific key kept as a typed extra, self times, shares, the costliest branch and estimates against reality worked out the same way for all, written as text and as our JSON, and analyzed by pure rules — each with its evidence, its threshold and SQL to suggest written through the dialect, never run — on the conditions read, the nodes taken back to the statement's text and statements' fingerprints), transactions with their isolation, the schema switched, the catalog read in bulk, refusals with their place and SQLSTATE; each with a default through `execute`), the SQLite table rebuild, CSV dialect and type inference (and records read and written by the same rules), rows sorted and filtered in memory for a source that writes no SQL; drivers are created only when a connection opens."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
# A dialect as the data extractors write SQL by (`extract`).
extractors.workspace = true

[features]
# `profile::testing::ProfileBuilder` for other crates' tests (the drivers', the console's).
testing = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
