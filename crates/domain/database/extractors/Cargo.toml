[package]
name = "extractors"
description = "Data extractors: what a grid's rows become when they're copied or exported — SQL INSERTs (one row or many a statement), UPDATEs by the key, a WHERE clause, separated values (CSV, TSV, pipes, semicolons and the user's own formats: separator, quote, header, NULL's text, line ending), JSON, Markdown, HTML, XML, one row, an aligned text table —, written a block of rows at a time through the source's SQL style; the catalog of those offered (the built-in ones, the modules', the user's templates per project) and the one chosen per project; a pure, safe template language for the user's own (loops over rows and columns, conditions, escaping filters, errors with their line and column)."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# No doctests (none written); `rustdoc` per crate made `cargo test` 3× slower.
[lib]
doctest = false

[dependencies]
kernel.workspace = true
i18n.workspace = true

[lints]
workspace = true
